# =============================================================================
# OmniMedical Suite — Production Docker Compose
# =============================================================================
# Canonical production surface: Gradio HITL OCR + PostgreSQL + Redis.
# All security-sensitive values must be supplied by the deployment environment.
# =============================================================================

services:
  ocr:
    build:
      context: .
      dockerfile: deploy/Dockerfile.gradio
      target: production
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      POSTGRES_USER: ${DB_USER:-medocr}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-medical_ocr}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      GRADIO_USERNAME: ${GRADIO_USERNAME:?GRADIO_USERNAME is required}
      GRADIO_PASSWORD: ${GRADIO_PASSWORD:?GRADIO_PASSWORD is required}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:?ADMIN_BOOTSTRAP_PASSWORD is required}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-admin}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@omni-medical-suite.local}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "7860:7860"
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-medocr}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-medical_ocr}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
