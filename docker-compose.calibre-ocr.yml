services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile.gradio
      target: production
    ports: ["7860:7860"]
    volumes: ["./data:/app/data","./calibre_library:/app/calibre_library"]
    environment:
      CALIBRE_LIBRARY_PATH: /app/calibre_library
      ENVIRONMENT: production
    depends_on: [calibre-web]
    restart: unless-stopped
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:0.6.24
    container_name: calibre-web
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/London
    volumes: ["./calibre_config:/config","./calibre_library:/books"]
    ports: ["8083:8083"]
    restart: unless-stopped
