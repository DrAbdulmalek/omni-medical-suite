version: "3.9"

# ============================================
# OmniMedical Suite — LITE Mode
# ============================================
# Minimal deployment: web + api only
# Usage: DEPLOYMENT_MODE=lite docker-compose -f docker-compose.lite.yml up
# Requirements: ~2GB RAM, 1 CPU

services:
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: dev
    ports:
      - "3000:3000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=sqlite:///./data/omnimedical_lite.db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET required}
      - NEXTAUTH_URL=http://localhost:3000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - web-data:/app/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
      target: dev
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=sqlite:///./data/omnimedical_lite.db
      - WORKERS=1
      - LOG_LEVEL=INFO
      - OCR_ENGINE=paddleocr
      - OCR_DEVICE=cpu
      - REDIS_ENABLED=false
    volumes:
      - ./services/api:/app/services/api
      - ./packages:/app/packages
      - api-data:/app/data
    depends_on: []
    restart: unless-stopped

volumes:
  web-data:
  api-data:
