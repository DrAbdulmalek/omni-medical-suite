[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers -p no:warnings
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    benchmark: marks tests as benchmarks
    integration: marks integration tests
    ocr: tests requiring OCR engines
    nlp: tests requiring NLP models
    gpu: tests requiring GPU
filterwarnings =
    ignore::DeprecationWarning
asyncio_mode = auto

# Monorepo path configuration
pythonpath = . src packages

# Exclude paths that should not be scanned
norecursedirs =
    .git
    .github
    node_modules
    __pycache__
    *.egg-info
    uploads
    data
    hf-space
    benchmarks
    packages/omniparse
    packages/omni-ocr