[pytest]
# ---------------------------------------------------------------------------
# Test discovery
# ---------------------------------------------------------------------------
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ---------------------------------------------------------------------------
# Default options
# ---------------------------------------------------------------------------
addopts = -v --tb=short --strict-markers -p no:warnings

# ---------------------------------------------------------------------------
# Custom markers
# ---------------------------------------------------------------------------
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    benchmark: marks tests as benchmarks
    integration: marks integration tests
    ocr: tests requiring OCR engines (tesseract, paddleocr)
    nlp: tests requiring NLP models
    gpu: tests requiring GPU
    requires_api_key: tests that call external APIs

# ---------------------------------------------------------------------------
# Warnings filter
# ---------------------------------------------------------------------------
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning

# ---------------------------------------------------------------------------
# Async support
# ---------------------------------------------------------------------------
asyncio_mode = auto

# ---------------------------------------------------------------------------
# Monorepo path configuration
# ---------------------------------------------------------------------------
pythonpath = . src packages

# ---------------------------------------------------------------------------
# Exclude paths that should not be scanned for tests
# ---------------------------------------------------------------------------
norecursedirs =
    .git
    .github
    node_modules
    __pycache__
    *.egg-info
    uploads
    data
    hf-space
    benchmarks
    notebooks
    legacy
    packages/omniparse
    packages/omni-ocr
    packages/ocr_postprocess/vendor
    .venv
    venv
    build
    dist

# ---------------------------------------------------------------------------
# Coverage (when --cov is used)
# ---------------------------------------------------------------------------
# addopts = --cov=src --cov=packages --cov=app --cov-report=term-missing --cov-report=html
# cov_fail_under = 50