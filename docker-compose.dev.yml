# =============================================================================
# OmniMedical Suite — Development Docker Compose
# =============================================================================
# Lightweight dev profile: Next.js web + Redis (SQLite dev DB).
# For the full stack (web + api + monitoring), use docker-compose.standard.yml
# or the infrastructure/docker/docker-compose.yml.
#
# Usage:
#   make dev          # or: docker compose -f docker-compose.dev.yml up --build
#   make prod-down    # stop: docker compose -f docker-compose.dev.yml down -v
# =============================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - DATABASE_URL=file:/data/dev.db
      - NEXTAUTH_URL=http://localhost:3000
    ports:
      - "3000:3000"
      - "8000:8000"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: npm run dev

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  node_modules:
