<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة التدريب</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
body { font-family: Tahoma, sans-serif; background: #1a1a2e; color: #eee;
       margin: 0; padding: 20px; }
h1 { color: #00d4ff; }
.panel { background: #16213e; border-radius: 12px; padding: 20px;
         margin: 15px 0; }
label { display: block; margin: 8px 0 4px; color: #aaa; }
input, select { width: 100%; padding: 10px; border-radius: 6px;
                border: 1px solid #333; background: #0f3460; color: #eee;
                box-sizing: border-box; font-size: 15px; }
button { background: #00d4ff; color: #000; border: none;
         padding: 12px 30px; border-radius: 8px; font-size: 16px;
         cursor: pointer; margin-top: 15px; font-weight: bold; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.metrics { display: grid; grid-template-columns: repeat(4, 1fr);
           gap: 15px; }
.metric { background: #0f3460; padding: 15px; border-radius: 8px;
          text-align: center; }
.metric .value { font-size: 28px; font-weight: bold; color: #00d4ff; }
.metric .label { font-size: 12px; color: #888; margin-top: 5px; }
.progress-bar { height: 20px; background: #0f3460; border-radius: 10px;
                overflow: hidden; margin: 15px 0; }
.progress-fill { height: 100%; background: linear-gradient(90deg,#00d4ff,#7b2ff7);
                 transition: width 0.5s; width: 0%; }
#log { background: #0a0a1a; padding: 15px; border-radius: 8px;
       font-family: monospace; font-size: 13px; max-height: 300px;
       overflow-y: auto; white-space: pre-wrap; }
.status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px;
                font-size: 13px; margin-right: 10px; }
.status-idle { background: #444; }
.status-running { background: #00d4ff; color: #000; }
.status-done { background: #28a745; }
.status-error { background: #dc3545; }
</style>
</head>
<body>
<h1>🧠 لوحة تدريب TrOCR العربي</h1>

<div class="panel">
    <h3>⚙️ إعدادات التدريب</h3>
    <label>مجلد البيانات</label>
    <input id="dataDir" value="output/S001">
    <label>مجلد المخرجات</label>
    <input id="outputDir" value="models/trocr-arabic">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">
        <div><label>Epochs</label><input id="epochs" type="number" value="20"></div>
        <div><label>Batch Size</label><input id="batch" type="number" value="8"></div>
        <div><label>Learning Rate</label><input id="lr" value="5e-5"></div>
    </div>
    <label>النموذج الأساسي</label>
    <select id="baseModel">
        <option value="microsoft/trocr-base-handwritten">TrOCR Base (Handwritten)</option>
        <option value="microsoft/trocr-large-handwritten">TrOCR Large (Handwritten)</option>
        <option value="RayR1/trocr-base-arabic-handwritten">TrOCR Arabic (Fine-tuned)</option>
    </select>
    <button id="startBtn" onclick="startTraining()">🚀 بدء التدريب</button>
</div>

<div class="panel">
    <h3>📊 الحالة الحالية
        <span id="statusBadge" class="status-badge status-idle">خامل</span>
    </h3>
    <div class="metrics">
        <div class="metric"><div class="value" id="mEpoch">0</div>
            <div class="label">Epoch</div></div>
        <div class="metric"><div class="value" id="mStep">0</div>
            <div class="label">Step</div></div>
        <div class="metric"><div class="value" id="mLoss">0.00</div>
            <div class="label">Loss</div></div>
        <div class="metric"><div class="value" id="mCER">--</div>
            <div class="label">CER</div></div>
    </div>
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>
    <div id="log">في انتظار بدء التدريب...</div>
</div>

<script>
const socket = io();
let totalEpochs = 20;

socket.on('training_started', (d) => {
    totalEpochs = d.epochs;
    setStatus('running', 'قيد التشغيل');
    document.getElementById('startBtn').disabled = true;
    log(`بدء التدريب: ${d.total} عينة, ${d.epochs} epoch`);
});

socket.on('training_update', (d) => {
    document.getElementById('mEpoch').textContent = d.epoch ? d.epoch.toFixed(1) : '0';
    document.getElementById('mStep').textContent = d.step;
    document.getElementById('mLoss').textContent = d.loss.toFixed(4);
    const pct = Math.min(100, (d.epoch / totalEpochs) * 100);
    document.getElementById('progressFill').style.width = pct + '%';
    log(`Epoch ${d.epoch?.toFixed(2)} | Step ${d.step} | Loss ${d.loss.toFixed(4)} | LR ${d.lr?.toExponential(2)}`);
});

socket.on('eval_update', (d) => {
    document.getElementById('mCER').textContent = d.cer.toFixed(4);
    log(`📊 تقييم Epoch ${d.epoch?.toFixed(1)}: CER=${d.cer.toFixed(4)} Loss=${d.loss.toFixed(4)}`);
});

socket.on('training_done', (d) => {
    setStatus('done', 'مكتمل ✓');
    document.getElementById('startBtn').disabled = false;
    document.getElementById('progressFill').style.width = '100%';
    log(`✅ اكتمل التدريب! CER النهائي: ${d.cer.toFixed(4)}`);
    log(`📁 النموذج في: ${d.output_dir}`);
});

socket.on('training_error', (d) => {
    setStatus('error', 'خطأ');
    document.getElementById('startBtn').disabled = false;
    log(`❌ خطأ: ${d.error}`);
});

function setStatus(cls, text) {
    const b = document.getElementById('statusBadge');
    b.className = 'status-badge status-' + cls;
    b.textContent = text;
}

function log(msg) {
    const el = document.getElementById('log');
    el.textContent += '\n' + msg;
    el.scrollTop = el.scrollHeight;
}

async function startTraining() {
    const data = {
        data_dir: document.getElementById('dataDir').value,
        output_dir: document.getElementById('outputDir').value,
        epochs: document.getElementById('epochs').value,
        batch: document.getElementById('batch').value,
        lr: document.getElementById('lr').value,
        base_model: document.getElementById('baseModel').value
    };
    document.getElementById('log').textContent = '';
    const r = await fetch('/api/start', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    });
    if (!r.ok) {
        const err = await r.json();
        alert('خطأ: ' + (err.error || 'فشل البدء'));
    }
}
</script>
</body>
</html>
