name: Deploy to Hugging Face

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install huggingface-hub

    - name: Push to Hugging Face
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        git config --global user.email "github-actions@github.com"
        git config --global user.name "GitHub Actions"

        # Clone the HF repo
        git clone https://huggingface.co/spaces/DrAbdulmalek/telegram-channel-copier hf-repo

        # Copy files
        cp -r ./* hf-repo/ 2>/dev/null || true

        # Push
        cd hf-repo
        git add .
        git commit -m "Update from GitHub Actions" || true
        git push https://$HF_TOKEN@huggingface.co/spaces/DrAbdulmalek/telegram-channel-copier main
