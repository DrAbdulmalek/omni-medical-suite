# =============================================================================
# OmniMedical Suite — Docker Compose (PHASE 4)
# =============================================================================
# Usage:
#   docker-compose up gradio                          # Gradio only (lightweight)
#   docker-compose --profile infra up                  # Full stack with DB/cache
#   docker-compose up gradio api                       # App services only
#
# Environment:
#   POSTGRES_PASSWORD  — PostgreSQL password (default: omni_dev_pass)
#   SECRET_KEY         — API auth secret (default: dev-secret-key-change-in-production)
#   GRAFANA_PASSWORD   — Grafana admin password (default: admin)
# =============================================================================

version: "3.9"

services:
  # ── Application Services ──────────────────────────────────────────────
  gradio:
    build:
      context: .
      dockerfile: Dockerfile.gradio
    ports:
      - "7860:7860"
    environment:
      - DATABASE_URL=postgresql://omnimedical:${POSTGRES_PASSWORD:-omni_dev_pass}@postgres:5432/omnimedical
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - ENVIRONMENT=development
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://omnimedical:${POSTGRES_PASSWORD:-omni_dev_pass}@postgres:5432/omnimedical
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - ENVIRONMENT=development
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Infrastructure (profile: infra) ───────────────────────────────────
  postgres:
    image: postgres:16-alpine
    profiles: ["infra"]
    environment:
      - POSTGRES_DB=omnimedical
      - POSTGRES_USER=omnimedical
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-omni_dev_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnimedical"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: ["infra"]
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["infra"]
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Maintenance Services ──────────────────────────────────────────────
  update-checker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: python -m scripts.update_checker
    environment:
      - VERSION=${VERSION:-v1.3.0}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    profiles: ["infra"]

  backup:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: python -m scripts.backup
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=omnimedical
      - DB_PASSWORD=${POSTGRES_PASSWORD:-omni_dev_pass}
      - DB_NAME=omnimedical
      - REDIS_URL=redis://redis:6379/0
      - BACKUP_DIR=/app/backups
    volumes:
      - ./backups:/app/backups
      - ./redis_data:/data:ro
    restart: unless-stopped
    profiles: ["infra"]

volumes:
  postgres_data:
  redis_data:
  qdrant_data: