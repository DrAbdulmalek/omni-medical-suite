name: Feature Request
description: >
  Suggest a new feature or enhancement for the OmniMedical Suite.
  Provide as much detail as possible so maintainers can evaluate scope and priority.
title: "[Feature] "
labels: ["enhancement", "triage"]
assignees: []
body:
  - type: input
    id: title_summary
    attributes:
      label: Title
      description: A concise title for the feature request.
      placeholder: "e.g. Add DICOM file format support for medical imaging"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: >
        A clear and detailed description of the feature you are requesting.
        Include the motivation: what problem does this solve, and for whom?
      placeholder: "As a radiologist, I need to upload DICOM images so that the OCR pipeline can extract text from embedded annotations."
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to your workflow?
      options:
        - Low
        - Medium
        - High
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the system would this feature affect?
      options:
        - Frontend
        - Backend
        - Worker
        - DB
        - Docker
        - CI
        - Monitoring
        - Other
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: >
        Describe how you envision this feature being implemented.
        Include API designs, UI mockups, or data model changes if applicable.
      placeholder: "Add a new /api/ocr/dicom endpoint that accepts .dcm files, extracts embedded text using pydicom, and returns structured OCR results."

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: >
        Describe any alternative solutions or workarounds you have tried
        or considered.
      placeholder: "Currently converting DICOM to PNG before uploading, but this loses metadata and requires an extra preprocessing step."