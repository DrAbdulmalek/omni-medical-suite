name: CD - Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build-and-push:
    name: Build & Push API to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install pinned specialty translation memory
        run: |
          chmod +x scripts/setup_dictionaries.sh
          bash scripts/setup_dictionaries.sh malek-dictionaries-v1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/drabdulmalek/omni-medical-suite/api
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Kubernetes deployment is intentionally not attempted here: this repository
  # currently has no k8s/ manifests or cluster-context setup. A workflow that
  # claims successful deployment while `kubectl apply -f k8s/` cannot resolve
  # the referenced directory would be misleading. Image publication remains
  # a real, verifiable CD stage until cluster deployment is provisioned.
