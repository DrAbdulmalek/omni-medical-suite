# ============================================================================
# GitHub Actions: Lint & Test
# Runs on every push and PR
# ============================================================================

name: Lint & Test

on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lint tools
        run: |
          pip install flake8 black isort mypy

      - name: Run flake8 (critical errors only)
        run: flake8 desktop/ hf-space/ app/ --count --select=E999 --show-source --statistics

      - name: Run flake8 (style report — informational)
        run: flake8 desktop/ hf-space/ app/ --count --statistics --exit-zero

      - name: Run black check (informational)
        run: black --check desktop/ hf-space/ app/ 2>/dev/null || true
        # black formatting is informational until the codebase is reformatted

      - name: Run isort check (informational)
        run: isort --check-only desktop/ hf-space/ app/ 2>/dev/null || true
        # isort is informational until the codebase is reformatted

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (Tesseract OCR)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng libtesseract-dev

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov pytest-asyncio
          pip install opencv-python Pillow numpy
          pip install "huggingface-hub<1.0.0" "pydantic<2.11.0"
          pip install python-jose passlib bcrypt python-multipart
          pip install httpx gradio
          pip install -r requirements/api.txt
          pip install -r requirements/ml.txt

      - name: Run tests
        env:
          ENVIRONMENT: development
          DEBUG: 'true'
          JWT_SECRET_KEY: 'ci-test-secret-key-32-chars-long!!'
        run: |
          pytest tests/ -v --cov=. --cov-report=xml \
            --ignore=tests/test_build_training_data.py \
            --ignore=tests/test_mobile_review_server.py \
            --ignore=tests/integration/ \
            --ignore=tests/test_e2e.py \
            --ignore=tests/test_htr.py \
            --ignore=tests/test_integration.py \
            --ignore=tests/test_integration_full.py \
            --ignore=tests/test_api_performance.py \
            --ignore=tests/test_ocr_engine.py \
            --ignore=tests/test_performance.py \
            --ignore=tests/test_pr92_production_specialty_runtime.py \
            --ignore=tests/test_sensitive_scanner.py \
            --ignore=tests/test_summarizer.py

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage.xml
          # Coverage upload is informational; test execution above is the gate.
          fail_ci_if_error: false
