name: Credential Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for baseline comparison

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_CONFIG: .gitleaks.toml

  # Legacy fixed-string check — kept as defense-in-depth until gitleaks
  # has been observed to be stable for 4 consecutive weeks, then this job
  # should be removed.
  legacy-default-credentials:
    name: Legacy default-credential check (defense-in-depth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for hardcoded default credentials
        run: |
          # NOTE: This is a backup scanner. The primary scanner is gitleaks above.
          # Patterns below are the original fixed-string list kept as
          # defense-in-depth. Real secrets are caught by gitleaks regex rules.
          FORBIDDEN_PATTERNS=(
            "admin123"
            "omnimedical_dev"
            "change-me-in-production"
            "omnimedical_secure"
            "omnimedical_standard"
            "dev-secret-key-change-in-production"
            "standard-mode-change-this"
            "dev-only-change-in-production"
            "SecureMedicalPIN123"
          )

          FOUND=0
          for pattern in "${FORBIDDEN_PATTERNS[@]}"; do
            # -I skips binary files, -i is case-insensitive
            MATCHES=$(git grep -Il "$pattern" -- ':!.env.example' ':!.env.*example' ':!SECURITY_NOTES.md' ':!.github/workflows/credential-scan.yml' 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              echo "::error::Found forbidden pattern '$pattern' in: $MATCHES"
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            echo "::error::Default credentials detected. Remove before merging."
            exit 1
          fi
          echo "No default credentials found."
