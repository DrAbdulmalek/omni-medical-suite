name: Credential Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  scan:
    name: Detect Default Credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for hardcoded credentials
        run: |
          FORBIDDEN_PATTERNS=(
            "admin123"
            "omnimedical_dev"
            "change-me-in-production"
          )

          FOUND=0
          for pattern in "${FORBIDDEN_PATTERNS[@]}"; do
            # Search in all tracked files, excluding .git
            MATCHES=$(git grep -il "$pattern" -- ':!.env.example' ':!.env.*example' 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              echo "::error::Found forbidden pattern '$pattern' in: $MATCHES"
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            echo "::error::Default credentials detected. Remove before merging."
            exit 1
          fi
          echo "No default credentials found."