# Security Scan — blocking on pull requests and weekly on Mondays
name: Security Scan

on:
  pull_request:
    branches: [main]
    paths:
      - 'requirements*.txt'
      - 'requirements/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'uv.lock'
      - 'Dockerfile*'
      - 'deploy/**'
      - '.github/workflows/security-scan.yml'
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  security-scan:
    name: Scan Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install --upgrade setuptools

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        # python-jose pulls ecdsa transitively. The reported Minerva/side-channel
        # advisory has no upstream fix, and ecdsa verification is unaffected.
        # This project signs/verifies JWTs with HS256 and does not use ECDSA/ECDH.
        # Keep the exception explicit and reviewable rather than making the
        # entire dependency scan non-blocking.
        #
        # IMPORTANT: pip-audit runs before installing Safety. Safety itself pulls
        # NLTK as a scanner dependency; installing Safety first would contaminate
        # the application environment being audited and could report scanner-only
        # vulnerabilities as if they were project dependencies.
        run: pip-audit --desc --ignore PYSEC-2026-1325

      - name: Install safety scanner
        run: pip install safety

      - name: Run safety check
        # Safety is installed only after pip-audit has completed so its own
        # dependencies are not included in the pip-audit target environment.
        # Safety reports the same unfixable ecdsa advisories under its own IDs.
        # They are explicitly scoped to ecdsa and documented above.
        run: safety check --full-report --ignore 64396 --ignore 64459
