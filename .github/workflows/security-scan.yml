# Security Scan — blocking on pull requests and weekly on Mondays
name: Security Scan

on:
  pull_request:
    branches: [main]
    paths:
      - 'requirements*.txt'
      - 'requirements/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'uv.lock'
      - 'Dockerfile*'
      - 'deploy/**'
      - '.github/workflows/security-scan.yml'
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  security-scan:
    name: Scan Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies and scanners
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install safety pip-audit

      - name: Run pip-audit
        run: pip-audit --desc

      - name: Run safety check
        run: safety check --full-report
