# Security Scan — runs weekly on Mondays
name: Security Scan

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  security-scan:
    name: Scan Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install safety
        run: pip install safety pip-audit

      - name: Run pip-audit
        run: pip-audit -r requirements.txt --desc 2>&1 | tee pip-audit-report.txt
        continue-on-error: true

      - name: Run safety check
        run: safety check --full-report -r requirements.txt 2>&1 | tee safety-report.txt
        continue-on-error: true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.run_number }}
          path: |
            pip-audit-report.txt
            safety-report.txt
          retention-days: 30