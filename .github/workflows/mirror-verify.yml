name: Mirror Verify

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: read

jobs:
  verify:
    name: Verify repo integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check git remotes
        run: |
          echo '=== Git remotes ==='
          git remote -v

      - name: Verify submodule integrity
        run: |
          echo '=== Submodule status ==='
          git submodule status || echo 'No submodules configured'
          echo ''
          echo '=== .gitmodules ==='
          cat .gitmodules 2>/dev/null || echo 'No .gitmodules file'

      - name: Check for broken gitlinks (mode 160000 without .gitmodules entry)
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Gitlink check ==='
          found=0
          declare -A configured_paths=()
          if [[ -f .gitmodules ]]; then
            while IFS= read -r path; do
              [[ -n "$path" ]] && configured_paths["$path"]=1
            done < <(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | cut -d' ' -f2-)
          fi

          while IFS=$'\t' read -r -d '' meta path; do
            mode="${meta%% *}"
            if [[ "$mode" != "160000" ]]; then
              continue
            fi
            found=1
            echo "Found gitlink: $path"
            if [[ -z "${configured_paths[$path]+x}" ]]; then
              echo "::error:: Gitlink '$path' has no matching submodule.*.path entry in .gitmodules"
              exit 1
            fi
          done < <(git ls-tree -r -z HEAD)

          if [[ "$found" -eq 0 ]]; then
            echo 'No gitlinks found'
          else
            echo 'All gitlinks have matching .gitmodules path entries'
          fi

      - name: Summary
        if: always()
        run: |
          echo '### Mirror Verify Summary' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Git remotes: checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- Submodules: verified' >> "$GITHUB_STEP_SUMMARY"
          echo '- Gitlinks: checked fail-closed' >> "$GITHUB_STEP_SUMMARY"


