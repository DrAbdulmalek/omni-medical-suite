name: Mirror Verify

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: read

jobs:
  verify:
    name: Verify repo integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check git remotes
        run: |
          echo '=== Git remotes ==='
          git remote -v

      - name: Verify submodule integrity
        run: |
          echo '=== Submodule status ==='
          git submodule status || echo 'No submodules configured'
          echo ''
          echo '=== .gitmodules ==='
          cat .gitmodules 2>/dev/null || echo 'No .gitmodules file'

      - name: Check for broken gitlinks (mode 160000 without .gitmodules entry)
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Gitlink check ==='
          found=0
          while IFS=$'\t' read -r -d '' meta path; do
            mode="${meta%% *}"
            if [[ "$mode" != "160000" ]]; then
              continue
            fi
            found=1
            echo "Found gitlink: $path"
            if ! grep -Fqx -- "path = $path" .gitmodules 2>/dev/null; then
              echo "::error:: Gitlink '$path' has no .gitmodules entry (will break checkout)"
              exit 1
            fi
          done < <(git ls-tree -r -z HEAD)

          if [[ "$found" -eq 0 ]]; then
            echo 'No gitlinks found'
          else
            echo 'All gitlinks have .gitmodules entries'
          fi

      - name: Summary
        if: always()
        run: |
          echo '### Mirror Verify Summary' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Git remotes: checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- Submodules: verified' >> "$GITHUB_STEP_SUMMARY"
          echo '- Gitlinks: checked fail-closed' >> "$GITHUB_STEP_SUMMARY"


      - name: Collect gitlink diagnostic
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git ls-tree -r HEAD > gitlinks-tree.txt
          grep '^160000' gitlinks-tree.txt > gitlinks-report.txt || true
          {
            echo '=== GITLINK REPORT ==='
            cat gitlinks-report.txt
            echo '=== SUBMODULE CONFIG ==='
            cat .gitmodules 2>/dev/null || true
          } > gitlinks-diagnostic.txt

      - name: Upload gitlink diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirror-verify-gitlink-diagnostic
          path: |
            gitlinks-diagnostic.txt
            gitlinks-report.txt
          if-no-files-found: warn
