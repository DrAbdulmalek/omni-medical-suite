name: Mirror Verify

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 0 * * 0"  # weekly

permissions:
  contents: read

jobs:
  verify:
    name: Verify repo integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check git remotes
        run: |
          echo '=== Git remotes ==='
          git remote -v

      - name: Verify submodule integrity
        run: |
          echo '=== Submodule status ==='
          git submodule status || echo 'No submodules configured'
          echo ''
          echo '=== .gitmodules ==='
          cat .gitmodules 2>/dev/null || echo 'No .gitmodules file'

      - name: Check for broken gitlinks (mode 160000 without .gitmodules entry)
        run: |
          set -euo pipefail
          echo '=== Gitlink check ==='
          git ls-tree -r HEAD | awk '$1 == "160000" {print $4}' > /tmp/gitlinks.txt
          if [ -s /tmp/gitlinks.txt ]; then
            echo 'Found gitlinks:'
            cat /tmp/gitlinks.txt
            echo ''
            while IFS= read -r path; do
              if ! grep -Fq "path = $path" .gitmodules 2>/dev/null; then
                echo "::error:: Gitlink '$path' has no .gitmodules entry (will break checkout)"
                exit 1
              fi
            done < /tmp/gitlinks.txt
            echo 'All gitlinks have .gitmodules entries'
          else
            echo 'No gitlinks found'
          fi

      - name: Summary
        if: always()
        run: |
          echo '### Mirror Verify Summary' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '- Git remotes: checked' >> $GITHUB_STEP_SUMMARY
          echo '- Submodules: verified' >> $GITHUB_STEP_SUMMARY
          echo '- Gitlinks: scanned for missing .gitmodules entries' >> $GITHUB_STEP_SUMMARY
