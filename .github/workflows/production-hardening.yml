name: Production Hardening Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'hf-space/**'
      - 'tests/**'
      - 'requirements/**'
      - 'deploy/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/production-hardening.yml'
  push:
    branches: [audit/production-hardening]
  workflow_dispatch:

jobs:
  security-gate:
    name: Production security regression gate
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password-123456
          POSTGRES_DB: omni_medical
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d omni_medical"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            'fastapi>=0.104' \
            'sqlalchemy>=2.0.51' \
            'python-jose[cryptography]>=3.5.0' \
            'passlib[bcrypt]>=1.7.4' \
            'bcrypt>=4.0.1,<5' \
            'pydantic>=2.0,<2.11' \
            'pydantic-settings>=2.0' \
            'python-multipart>=0.0.32' \
            'asyncpg>=0.29' \
            'psycopg[binary]>=3.1' \
            'alembic>=1.12' \
            'slowapi>=0.1.9' \
            'pytest>=8' \
            'pytest-asyncio>=0.23' \
            'pytest-httpx>=0.30' \
            'httpx>=0.27'

      - name: Verify production secret fail-closed behavior
        env:
          ENVIRONMENT: production
          DEBUG: 'false'
        run: |
          python - <<'PY'
          from app.config.security import SecurityConfig
          try:
              SecurityConfig.validate_config('production', False)
          except ValueError:
              print('PASS: insecure production defaults rejected')
          else:
              raise SystemExit('FAIL: insecure production defaults were accepted')
          PY

      - name: Verify shipped production environment fails closed
        env:
          ENVIRONMENT: production
          DEBUG: 'false'
          JWT_SECRET_KEY: ''
          POSTGRES_PASSWORD: ''
        run: |
          python - <<'PY'
          import os
          from app.config.security import SecurityConfig
          try:
              SecurityConfig.validate_config(os.environ['ENVIRONMENT'], False)
          except ValueError:
              print('PASS: empty production secrets rejected')
          else:
              raise SystemExit('FAIL: empty production secrets were accepted')
          PY

      - name: Compile application code
        run: python -m compileall -q app scripts src

      - name: Apply Alembic migrations to PostgreSQL
        env:
          ENVIRONMENT: development
          DEBUG: 'true'
          DATABASE_URL: postgresql+psycopg://postgres:test-password-123456@127.0.0.1:5432/omni_medical
        run: alembic upgrade head

      - name: Run authentication unit tests
        env:
          ENVIRONMENT: development
          DEBUG: 'true'
          JWT_SECRET_KEY: '01234567890123456789012345678901'
        run: pytest -q tests/test_auth_security.py

      - name: Run security hardening tests
        env:
          ENVIRONMENT: development
          DEBUG: 'true'
          JWT_SECRET_KEY: '01234567890123456789012345678901'
        run: pytest -q tests/test_security_hardening.py

      - name: Run medical safety contract tests
        env:
          ENVIRONMENT: development
          DEBUG: 'true'
          JWT_SECRET_KEY: '01234567890123456789012345678901'
        run: pytest -q tests/security/test_medical_safety_contract.py

      - name: Run PostgreSQL authentication integration tests
        env:
          ENVIRONMENT: development
          DEBUG: 'true'
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password-123456
          POSTGRES_DB: omni_medical
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: '5432'
          JWT_SECRET_KEY: '01234567890123456789012345678901'
        run: pytest -q -vv tests/integration/test_auth_postgres.py

      - name: Validate production Compose configuration
        env:
          JWT_SECRET_KEY: '01234567890123456789012345678901'
          DB_PASSWORD: test-password-123456
          GRADIO_USERNAME: ci
          GRADIO_PASSWORD: ci-password-123456
          ADMIN_BOOTSTRAP_PASSWORD: ci-admin-password-123456
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Build the exact production Gradio image
        run: docker build --target production -f deploy/Dockerfile.gradio -t omni-medical-suite:production .

      - name: Reject false-green patterns
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/production-hardening.yml').read_text(encoding='utf-8')
          forbidden = re.compile(r'continue-on-error:\s*true|--exit-zero|\|\|\s*true')
          violations = []
          for lineno, line in enumerate(workflow.splitlines(), 1):
              if 'forbidden = re.compile' in line:
                  continue
              if forbidden.search(line):
                  violations.append(f'{lineno}: {line}')
          if violations:
              print('False-green pattern detected in production hardening workflow:')
              print('\n'.join(violations))
              raise SystemExit(1)
          print('PASS: no false-green patterns in production hardening workflow')
          PY
