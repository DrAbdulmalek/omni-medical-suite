name: CI — omni-medical-suite

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'packages/**'
      - 'app/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'packages/**'
      - 'app/**'
      - 'tests/**'

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lint deps
        run: |
          pip install ruff mypy

      - name: Ruff check
        run: ruff check src/ packages/ app/ --output-format=github || true

      - name: Ruff format check
        run: ruff format --check src/ packages/ app/ || true

      - name: MyPy type check
        run: mypy src/ packages/ --ignore-missing-imports --warn-unused-ignores || true

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', 'pyproject.toml') }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y             tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng             libgl1-mesa-glx libglib2.0-0

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio
          pip install -e packages/scanner_fixer
          pip install -r requirements.txt || true
          pip install -r requirements-dev.txt || true

      - name: Run unit tests
        run: pytest tests/unit/ -v --cov=src --cov=packages --cov-report=xml --cov-report=term -x

      - name: Run smoke tests
        run: pytest tests/smoke/ -v -x || true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  appimage-build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 desktop-file-utils
          pip install pyinstaller

      - name: Build AppImage
        run: |
          cd packages/desktop
          bash build_appimage.sh --version-from-git --smoke-test || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ github.run_id }}
          path: packages/desktop/*.AppImage
