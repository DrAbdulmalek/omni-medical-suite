name: Build Android APK

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'mobile/android/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install buildozer + dependencies
        run: |
          pip install --upgrade pip
          pip install \
            "buildozer==1.5.0" \
            "cython==0.29.36" \
            "virtualenv" \
            "sh" \
            "jinja2" \
            "six" \
            "huggingface_hub==0.20.3"

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
            mobile/android/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('mobile/android/buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Download offline models
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        working-directory: mobile/android
        run: |
          if [ -n "$HF_TOKEN" ]; then
            huggingface-cli login --token "$HF_TOKEN" || true
          fi
          python download_models.py || echo "⚠ model download failed (will use placeholder)"

      - name: Pre-build check
        working-directory: mobile/android
        run: python prebuild.py

      - name: Build debug APK
        working-directory: mobile/android
        run: buildozer -v android debug
        continue-on-error: true
        id: build

      - name: Post-build check
        if: steps.build.outcome == 'success'
        working-directory: mobile/android
        run: python postbuild.py

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: OmniMedical-APK-${{ github.ref_name }}
          path: mobile/android/bin/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build log on failure
        if: steps.build.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: buildozer-failure-log
          path: |
            mobile/android/.buildozer/android/platform/build/**/*.log
            /tmp/buildozer*.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: OmniMedical-APK-${{ github.ref_name }}
          path: bin/

      - name: Compute checksum
        run: |
          cd bin
          for apk in *.apk; do
            sha256sum "$apk" > "${apk}.sha256"
          done
          ls -la

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/*.apk
            bin/*.apk.sha256
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') }}
