name: RC Gate — v1.1.0

# P2-1: comprehensive quality gate for v1.1.0.
# Runs on pushes to main or manually. Every required check is fail-closed.

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'app/**'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/rc-gate.yml'
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check src/ packages/ app/ scripts/
      - run: ruff format --check src/ packages/ app/ scripts/

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install mypy
      - run: mypy src/ packages/core packages/nlp --config-file mypy.ini

  test-critical:
    name: Critical Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ara
          pip install pytest pytest-cov rapidfuzz numpy
          pip install -r requirements.txt
      - run: pytest tests/ -x -q --tb=short -k "not integration and not e2e and not loadtest" --ignore=tests/integration --ignore=tests/loadtest

  mobile-smoke:
    name: Mobile Server Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps + start server
        run: |
          python -m venv /tmp/omni-venv
          /tmp/omni-venv/bin/pip install --quiet flask opencv-python-headless pydantic Pillow numpy
          OMNI_MOBILE_DB_DIR=/tmp/omni-test-data PYTHONPATH=$(pwd) PYTHONUNBUFFERED=1 \
            /tmp/omni-venv/bin/python -m packages.core.mobile.server --host 0.0.0.0 --port 5000 &
          sleep 5
      - name: Health check
        run: |
          STATUS=$(curl -fsS http://localhost:5000/health | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
          [ "$STATUS" = "ok" ] || { echo "Mobile server health check failed"; exit 1; }

  security:
    name: Security Scan (bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install bandit
      - run: bandit -r src/ packages/ app/ scripts/ -ll -x packages/omniparse,packages/omni-ocr,packages/ocr_postprocess/vendor,tests

  lfs-audit:
    name: LFS Coverage Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - run: bash scripts/audit-lfs-coverage.sh

  rc-gate:
    name: RC Gate — All Checks
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-critical, mobile-smoke, security, lfs-audit]
    if: always()
    steps:
      - name: Evaluate gate
        run: |
          echo "## RC Gate Results" >> "$GITHUB_STEP_SUMMARY"
          for job in lint typecheck test-critical mobile-smoke security lfs-audit; do
            RESULT="${{ needs.lint.result }}"
            case "$job" in
              typecheck) RESULT="${{ needs.typecheck.result }}" ;;
              test-critical) RESULT="${{ needs.test-critical.result }}" ;;
              mobile-smoke) RESULT="${{ needs.mobile-smoke.result }}" ;;
              security) RESULT="${{ needs.security.result }}" ;;
              lfs-audit) RESULT="${{ needs.lfs-audit.result }}" ;;
            esac
            ICON=$([ "$RESULT" = "success" ] && echo "✅" || echo "❌")
            echo "| $job | $ICON $RESULT |" >> "$GITHUB_STEP_SUMMARY"
          done
          for result in \
            "${{ needs.lint.result }}" \
            "${{ needs.typecheck.result }}" \
            "${{ needs.test-critical.result }}" \
            "${{ needs.mobile-smoke.result }}" \
            "${{ needs.security.result }}" \
            "${{ needs.lfs-audit.result }}"; do
            if [[ "$result" != "success" ]]; then
              exit 1
            fi
          done
          echo "✅ RC Gate PASSED — ready for release tag"
