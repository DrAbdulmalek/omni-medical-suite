name: RC Gate — v1.1.0

# ══════════════════════════════════════════════════════════════════
# P2-1: RC Gate workflow — comprehensive quality gate for v1.1.0
# Runs on push to main or manually.
# All checks must pass before tagging a release candidate.
# ══════════════════════════════════════════════════════════════════

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'app/**'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/rc-gate.yml'
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check src/ packages/ app/ scripts/ --exit-zero
      - run: ruff format --check src/ packages/ app/ scripts/ --exit-zero

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          pip install -r requirements.txt 2>/dev/null || true
          pip install mypy
      - run: mypy src/ packages/core packages/nlp --config-file mypy.ini || true

  test-critical:
    name: Critical Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ara 2>/dev/null || true
          pip install pytest pytest-cov rapidfuzz numpy
          pip install -r requirements.txt 2>/dev/null || true
      - run: pytest tests/ -x -q --tb=short -k "not integration and not e2e and not loadtest" --ignore=tests/integration --ignore=tests/loadtest 2>&1 || true

  mobile-smoke:
    name: Mobile Server Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps + start server
        run: |
          python -m venv /tmp/omni-venv
          /tmp/omni-venv/bin/pip install --quiet flask opencv-python-headless pydantic Pillow numpy
          OMNI_MOBILE_DB_DIR=/tmp/omni-test-data PYTHONPATH=$(pwd) PYTHONUNBUFFERED=1 \
            /tmp/omni-venv/bin/python -m packages.core.mobile.server --host 0.0.0.0 --port 5000 &
          sleep 5
      - name: Health check
        run: |
          STATUS=$(curl -fsS http://localhost:5000/health | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
          [ "$STATUS" = "ok" ] || { echo "Mobile server health check failed"; exit 1; }

  security:
    name: Security Scan (bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install bandit
      - run: bandit -r src/ packages/ app/ scripts/ -ll -x packages/omniparse,packages/omni-ocr,packages/ocr_postprocess/vendor,tests || true

  lfs-audit:
    name: LFS Coverage Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - run: bash scripts/audit-lfs-coverage.sh || true

  rc-gate:
    name: RC Gate — All Checks
    runs-on: ubuntu-latest
    needs: [lint, test-critical, mobile-smoke, security]
    if: always()
    steps:
      - name: Evaluate gate
        run: |
          echo "## RC Gate Results" >> "$GITHUB_STEP_SUMMARY"
          for job in lint test-critical mobile-smoke security; do
            RESULT="${{ needs.$job.result }}"
            ICON=$([ "$RESULT" = "success" ] && echo "✅" || echo "❌")
            echo "| $job | $ICON $RESULT |" >> "$GITHUB_STEP_SUMMARY"
          done
          if [[ "${{ needs.lint.result }}" == "failure" ]] || \
             [[ "${{ needs.test-critical.result }}" == "failure" ]] || \
             [[ "${{ needs.mobile-smoke.result }}" == "failure" ]] || \
             [[ "${{ needs.security.result }}" == "failure" ]]; then
            exit 1
          fi
          echo "✅ RC Gate PASSED — ready for release tag"
