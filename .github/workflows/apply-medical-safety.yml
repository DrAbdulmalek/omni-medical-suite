name: Apply medical safety hardening

on:
  push:
    branches: [audit/production-hardening]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply medical safety patch
        run: python scripts/medical_safety_patch.py
      - name: Commit patch
        run: |
          git config user.name 'omni-medical-security-bot'
          git config user.email 'security-bot@users.noreply.github.com'
          git add hf-space/app.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: enforce medical OCR review and confidence gate'
          git push
