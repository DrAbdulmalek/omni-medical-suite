# ============================================================================
# GitHub Actions: Release — v1.1.0 (P2-1)
# Triggered on version tags (v*) or manual dispatch
# Creates GitHub Release + AppImage + Docker push
# ============================================================================

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.1.0)'
        required: true
      prerelease:
        description: 'Mark as pre-release?'
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  build-appimage:
    name: Build AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            packages/desktop/requirements.txt
            packages/scanner_fixer/pyproject.toml
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ara poppler-utils libfuse2 libxcb-xinerama0 libxcb-cursor0 libgl1 wget
      - run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.24.0,<2.0.0"
          pip install -e packages/scanner_fixer
          pip install -r packages/desktop/requirements.txt
          pip install pyinstaller
      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: |
          cd packages/desktop
          bash build_appimage.sh "${{ steps.version.outputs.version }}"
        env:
          OMNI_APPIMAGE_OFFSCREEN: "1"
      - run: |
          cd packages/desktop
          APPIMAGE_FILE="$(ls MedicalDocProcessor-*.AppImage | head -1)"
          sha256sum -c "${APPIMAGE_FILE}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: AppImage-release
          path: |
            packages/desktop/MedicalDocProcessor-*.AppImage
            packages/desktop/MedicalDocProcessor-*.AppImage.sha256
          retention-days: 90

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-appimage]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: AppImage-release
          path: release-artifacts/
      - name: Generate changelog
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s" --no-merges -30)
          else
            CHANGES=$(git log --pretty=format:"- %s" --no-merges "${LAST_TAG}..HEAD")
          fi
          echo "changes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "$TAG_NAME" == *"-rc"* ]] || [[ "$TAG_NAME" == *"-beta"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          body: |
            ## OmniMedical Suite ${{ github.ref_name }}

            ### Changes
            ${{ steps.changelog.outputs.changes }}

            ### AppImage (Linux x86_64)
            ```bash
            chmod +x MedicalDocProcessor-*.AppImage
            ./MedicalDocProcessor-*.AppImage
            ```
            Verify checksum:
            ```bash
            sha256sum -c MedicalDocProcessor-*.AppImage.sha256
            ```
            ### Install PWA (Linux/Manjaro)
            ```bash
            bash scripts/install_mobile_pwa.sh
            ```
          prerelease: ${{ steps.changelog.outputs.is_prerelease == 'true' }}
          files: |
            release-artifacts/MedicalDocProcessor-*.AppImage
            release-artifacts/MedicalDocProcessor-*.AppImage.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-docker:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: [create-release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install pinned specialty translation memory
        run: |
          chmod +x scripts/setup_dictionaries.sh
          bash scripts/setup_dictionaries.sh malek-dictionaries-v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/omni-medical-api:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/omni-medical-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
