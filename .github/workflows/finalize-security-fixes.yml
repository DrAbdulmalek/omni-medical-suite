name: Finalize security fixes

on:
  push:
    branches: [security-fixes-3451e6e]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message != 'Security fixes: finalize verified changes'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security-fixes-3451e6e
          fetch-depth: 1

      - name: Apply exact security fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          # Remove only OCR dictionary entries whose keys contain a trailing separator.
          p = Path('hf-space/app_core.py')
          s = p.read_text(encoding='utf-8')
          old = s
          for wrong, right in [
              ('ديكلوفيناك ', 'ديكلوفيناك'),
              ('اوميبرازول ', 'اوميبرازول'),
              ('سيليبريكس ', 'سيليبريكس'),
              ('ترامادول ', 'ترامادول'),
              ('كاتافلام ', 'كاتافلام'),
              ('نوفافين ', 'نوفافين'),
              ('فلاميكس ', 'فلاميكس'),
              ('بنادول ', 'بنادول'),
              ('ادفيل ', 'ادفيل'),
          ]:
              s = s.replace(f'"{wrong}": "{right}"', f'"{right}": "{right}"')
          p.write_text(s, encoding='utf-8')

          # Authenticate the admin stub.
          p = Path('app/routers/admin.py')
          s = p.read_text(encoding='utf-8')
          if 'Depends(get_current_user)' not in s:
              s = s.replace('from fastapi import APIRouter\n', 'from fastapi import APIRouter, Depends\nfrom app.core.security import get_current_user\nfrom app.db.models.auth import User\n', 1)
              s = s.replace('async def system_status():', 'async def system_status(current_user: User = Depends(get_current_user)):', 1)
          p.write_text(s, encoding='utf-8')

          # Separate alternate full-stack deployment; never overwrite root compose.
          old = Path('deploy/docker-compose.prod.yml')
          new = Path('deploy/docker-compose.full.yml')
          if old.exists() and not new.exists():
              old.rename(new)
          if not new.exists():
              raise SystemExit('missing deploy/docker-compose.full.yml')

          p = Path('deploy/deploy.sh')
          s = p.read_text(encoding='utf-8')
          if 'cp "${DEPLOY_DIR}/docker-compose.prod.yml" "${PROJECT_DIR}/docker-compose.prod.yml"' in s:
              s = s.replace('if [[ -f "${DEPLOY_DIR}/docker-compose.prod.yml" ]]; then\n    cp "${DEPLOY_DIR}/docker-compose.prod.yml" "${PROJECT_DIR}/docker-compose.prod.yml"\nfi', 'COMPOSE_FILE="${DEPLOY_DIR}/docker-compose.full.yml"\nif [[ ! -f "$COMPOSE_FILE" ]]; then\n    error "Full-stack compose file not found: $COMPOSE_FILE"\nfi')
          if 'COMPOSE_FILE=' not in s:
              marker = 'DEPLOY_DIR="$(dirname "$0")"\n'
              s = s.replace(marker, marker + 'COMPOSE_FILE="${DEPLOY_DIR}/docker-compose.full.yml"\n', 1)
          s = s.replace('docker compose -f docker-compose.prod.yml', 'docker compose --project-directory "$PROJECT_DIR" -f "$COMPOSE_FILE"')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Add real behavioral regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/security
          cat > tests/security/test_medical_behavior.py <<'PY'
          import sys
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[2]
          sys.path.insert(0, str(ROOT / 'hf-space'))
          import app_core

          def test_tramadol_dose_separator_preserved():
              out, _ = app_core._auto_correct_ocr('ترامادول 0.5 mg')
              assert out == 'ترامادول 0.5 mg'

          def test_medical_negation_and_dose_preserved():
              text = 'لا يعطى ترامادول 0.5 mg'
              out, _ = app_core._auto_correct_ocr(text)
              assert out == text

          def test_decimals_preserved():
              for text in ['0.5', '1.25', '0.75', '٠٫٥', '١٫٢٥']:
                  out, _ = app_core._auto_correct_ocr(text)
                  assert out == text

          def test_negations_preserved():
              for text in ['لا', 'ليس', 'لم', 'لن', 'غير', 'بدون', 'لا يوجد سكري']:
                  out, _ = app_core._auto_correct_ocr(text)
                  assert out == text

          def test_intended_ocr_correction_remains():
              out, _ = app_core._auto_correct_ocr('باراسيتبمول 500 mg')
              assert out == 'باراسيتامول 500 mg'
          PY

      - name: Execute real tests and source checks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest numpy opencv-python-headless 'gradio<6' >/dev/null
          pytest -q tests/security/test_medical_behavior.py
          test -f deploy/docker-compose.full.yml
          test -f docker-compose.prod.yml
          ! grep -q 'cp .*docker-compose.prod.yml.*docker-compose.prod.yml' deploy/deploy.sh
          grep -q 'docker-compose.full.yml' deploy/deploy.sh
          grep -q 'Depends(get_current_user)' app/routers/admin.py
          ! grep -q '"ترامادول ": "ترامادول"' hf-space/app_core.py
          python - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path('hf-space/app_core.py').read_text(encoding='utf-8'))
          ast.parse(Path('app/routers/admin.py').read_text(encoding='utf-8'))
          PY

      - name: Show diff
        run: git diff --check && git diff --stat && git status --short

      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hf-space/app_core.py app/routers/admin.py deploy/deploy.sh deploy/docker-compose.full.yml tests/security/test_medical_behavior.py .github/workflows/finalize-security-fixes.yml
          git status --short
          git commit -m 'Security fixes: finalize verified changes'
          git push origin security-fixes-3451e6e
