# ============================================================================
# GitHub Actions: Build & Push Docker Image
# Scanner Fixer Pro v2.0 - Omni Medical Suite
# ============================================================================
# Triggers:
#   - Push to main branch
#   - Push version tags (v*)
#   - Pull requests (build only, no push)
#   - Manual trigger (workflow_dispatch)
#
# Pushes to:
#   - GitHub Container Registry (GHCR) - default
#   - Docker Hub (optional, set secrets)
#
# Features:
#   - Multi-stage build (builder + final)
#   - Layer caching (GHA cache)
#   - Multi-platform (linux/amd64, linux/arm64)
#   - Vulnerability scanning (Trivy)
#   - Semantic versioning tags
#   - Auto-deploy to Hugging Face Space
# ============================================================================

name: Build & Push Docker Image

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      push_to_dockerhub:
        description: 'Push to Docker Hub too?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  IMAGE_NAME: scanner-fixer-pro
  REGISTRY_GHCR: ghcr.io
  REGISTRY_DOCKERHUB: docker.io
  # Critical version pins to avoid compatibility issues
  # See: gradio-app/gradio#11722 (pydantic boolean JSON schema crash)
  HUGGINGFACE_HUB_VERSION: '<1.0.0'
  PYDANTIC_VERSION: '<2.11.0'

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # ==========================================================================
  # Job 1: Lint & Test (always runs)
  # ==========================================================================
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install flake8 black pytest
          # Install with version constraints
          pip install \
            "huggingface_hub${{ env.HUGGINGFACE_HUB_VERSION }}" \
            "pydantic${{ env.PYDANTIC_VERSION }}" \
            opencv-python Pillow numpy gradio gradio-client datasets pandas

      - name: Lint with flake8
        run: |
          flake8 desktop/ --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Check formatting with black
        run: |
          black --check desktop/ || true

      - name: Run tests
        run: |
          pytest tests/ -v || echo "No tests found"

  # ==========================================================================
  # Job 2: Build & Push Docker Image
  # ==========================================================================
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      # ----------------------------------------------------------------------
      # Step 1: Checkout
      # ----------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------------------------
      # Step 2: Set up QEMU (for multi-platform builds)
      # ----------------------------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # ----------------------------------------------------------------------
      # Step 3: Set up Docker Buildx
      # ----------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:latest

      # ----------------------------------------------------------------------
      # Step 4: Extract metadata (tags, labels)
      # ----------------------------------------------------------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY_DOCKERHUB }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Scanner Fixer Pro
            org.opencontainers.image.description=Medical Document Image Enhancement
            org.opencontainers.image.vendor=Omni Medical Suite
            org.opencontainers.image.version=${{ github.ref_name }}

      # ----------------------------------------------------------------------
      # Step 5: Log in to GitHub Container Registry (GHCR)
      # ----------------------------------------------------------------------
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------------------
      # Step 6: Log in to Docker Hub (optional)
      # ----------------------------------------------------------------------
      - name: Log in to Docker Hub
        if: github.event.inputs.push_to_dockerhub == 'true' || github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_DOCKERHUB }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ----------------------------------------------------------------------
      # Step 7: Build and push Docker image
      # ----------------------------------------------------------------------
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.final
          target: final
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build arguments for version pinning
          build-args: |
            HUGGINGFACE_HUB_VERSION=${{ env.HUGGINGFACE_HUB_VERSION }}
            PYDANTIC_VERSION=${{ env.PYDANTIC_VERSION }}
          # Layer caching - speeds up subsequent builds
          cache-from: type=gha,scope=scanner-fixer-pro
          cache-to: type=gha,mode=max,scope=scanner-fixer-pro

      # ----------------------------------------------------------------------
      # Step 8: Scan image for vulnerabilities (Trivy)
      # ----------------------------------------------------------------------
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Don't fail build, just report

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      # ----------------------------------------------------------------------
      # Step 9: Build summary
      # ----------------------------------------------------------------------
      - name: Build summary
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | ${{ env.IMAGE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platforms** | linux/amd64, linux/arm64 |" >> $GITHUB_STEP_SUMMARY
          echo "| **GHCR** | ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tags** | ${{ join(steps.meta.outputs.tags, ', ') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Digest** | ${{ steps.docker_build.outputs.digest }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull Command" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # Job 3: Deploy to Hugging Face Space (on tags only)
  # ==========================================================================
  deploy-hf:
    name: Deploy to HF Space
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Hugging Face Hub
        run: pip install huggingface-hub

      - name: Sync to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Clone HF Space
          git clone https://huggingface.co/spaces/${{ github.repository_owner }}/medical-ocr-demo hf-space-clone

          # Sync scanner-fixer files to HF Space
          mkdir -p hf-space-clone/scanner-fixer
          cp desktop_scanner_fixer_pro_v2.py hf-space-clone/scanner-fixer/
          cp hf_connector.py hf-space-clone/scanner-fixer/
          cp hf_auto_dataset.py hf-space-clone/scanner-fixer/
          cp gradio_scanner_app.py hf-space-clone/scanner-fixer/

          # Update requirements with pinned versions
          cat > hf-space-clone/requirements.txt << 'REQEOF'
          # Scanner Fixer Pro - Pinned Requirements
          # Fixes: gradio-app/gradio#11722 (pydantic boolean JSON schema crash)
          opencv-python>=4.8.0,<5.0.0
          Pillow>=10.0.0,<11.0.0
          numpy>=1.24.0,<2.0.0
          gradio>=4.44.0,<5.0.0
          gradio-client>=0.8.0,<1.0.0
          huggingface-hub>=0.19.0,<1.0.0
          datasets>=2.14.0,<3.0.0
          pydantic>=2.0.0,<2.11.0
          pandas>=2.0.0,<3.0.0
          requests>=2.31.0
          REQEOF

          # Commit and push
          cd hf-space-clone
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "Auto-deploy: Scanner Fixer Pro ${{ github.ref_name }}" || true
          git push https://$HF_TOKEN@huggingface.co/spaces/${{ github.repository_owner }}/medical-ocr-demo main

      - name: Verify HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          sleep 30  # Wait for HF to start building
          echo "HF Space deployment triggered. Check: https://huggingface.co/spaces/${{ github.repository_owner }}/medical-ocr-demo"
