# =============================================================================
# Auto-Deploy Gradio App to HuggingFace Spaces
# =============================================================================
# Triggers: Push to main when hf-space/ or Dockerfile.gradio changes
# Target: DrAbdulmalek/omni-medical-ocr HF Space
#
# Strategy: Sync ALL hf-space/ contents (app.py, Dockerfile, requirements.txt,
# src/, packages/, config/) to the HF Space repo. This ensures the Space always
# matches the monorepo's deployment artifacts.
# =============================================================================

name: Deploy to HuggingFace Spaces

on:
  push:
    branches: [main]
    paths:
      - "hf-space/**"
      - "Dockerfile.gradio"

concurrency:
  group: hf-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to HF Spaces
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Verify HF_TOKEN is set
        run: |
          if [ -z "${{ secrets.HF_TOKEN }}" ]; then
            echo "::error:: HF_TOKEN secret is not set in repository settings"
            echo "::error:: Add it at: Settings -> Secrets and variables -> Actions"
            exit 1
          fi

      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "DrAbdulmalek"
          git config --global user.email "drabdulmalek@proton.me"

      - name: Clone HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone "https://DrAbdulmalek:${HF_TOKEN}@huggingface.co/spaces/DrAbdulmalek/omni-medical-ocr" hf-space-deploy
          cd hf-space-deploy
          git lfs pull 2>/dev/null || true

      - name: Sync all hf-space files
        run: |
          cd hf-space-deploy

          # Remove old generated files
          rm -rf src/ packages/ config/ app_services/

          # Copy ALL deployment artifacts from monorepo
          cp -f ../hf-space/app.py ./app.py
          cp -f ../hf-space/Dockerfile ./Dockerfile
          cp -f ../hf-space/requirements.txt ./requirements.txt
          cp -r ../hf-space/src/ ./src/
          cp -r ../hf-space/packages/ ./packages/
          cp -r ../hf-space/config/ ./config/ 2>/dev/null || mkdir -p config

          # Copy shared services (for adapter imports)
          mkdir -p app_services/services
          cp ../app/services/*.py ./app_services/services/ 2>/dev/null || true
          cp ../app/services/__init__.py ./app_services/services/ 2>/dev/null || true

          # Copy .dockerignore if present
          cp -f ../hf-space/.dockerignore ./.dockerignore 2>/dev/null || true

          echo "=== Synced files ==="
          find . -maxdepth 1 -type f -name "*.py" -o -name "Dockerfile" -o -name "requirements.txt" | sort
          echo "=== Dirs ==="
          echo "src/: $(find src/ -name '*.py' | wc -l) files"
          echo "packages/: $(find packages/ -name '*.py' | wc -l) files"

      - name: Push to HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd hf-space-deploy
          git add -A
          CHANGED=$(git diff --cached --stat)
          if [ -n "$CHANGED" ]; then
            git commit -m "auto-deploy from omni-medical-suite@${GITHUB_SHA::7}"
            git push "https://DrAbdulmalek:${HF_TOKEN}@huggingface.co/spaces/DrAbdulmalek/omni-medical-ocr" main
            echo "✅ Deployed to https://huggingface.co/spaces/DrAbdulmalek/omni-medical-ocr"
          else
            echo "No changes to deploy"
          fi