# =============================================================================
# Auto-Deploy Gradio App to HuggingFace Spaces
# =============================================================================
# Triggers: Push to main when hf-space/ or Dockerfile.gradio changes
# Target: DrAbdulmalek/omni-medical-ocr HF Space
#
# Strategy: Sync ALL hf-space/ contents (app.py, Dockerfile, requirements.txt,
# src/, packages/, config/) to the HF Space repo. This ensures the Space always
# matches the monorepo's deployment artifacts.
# =============================================================================

name: Deploy to HuggingFace Spaces

on:
  push:
    branches: [main]
    paths:
      - "hf-space/**"
      - "Dockerfile.gradio"

concurrency:
  group: hf-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to HF Spaces
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Verify HF_TOKEN is set
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # `${{ secrets.* }}` داخل run يُستبدل نصيًّا قبل تنفيذ الصدفة: أي حرف خاص
        # في القيمة يكسر السكربت أو يتيح حقن أوامر. الفحص عبر env فقط.
        run: |
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::error:: HF_TOKEN secret is not set in repository settings"
            echo "::error:: Add it at: Settings -> Secrets and variables -> Actions"
            exit 1
          fi

      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "DrAbdulmalek"
          git config --global user.email "drabdulmalek@proton.me"

      - name: Configure Git credential helper (token never enters the remote URL)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # لماذا: `https://user:${TOKEN}@host/...` يكتب التوكن داخل `.git/config`
        # ويعرّضه في `git remote -v` وقائمة العمليات (`ps`) ورسائل الخطأ.
        # البديل: ملف اعتمادات بصلاحيات 600 خارج المستودع + helper يشير إليه،
        # فيبقى remote نظيفًا ويُحذف الملف في نهاية المهمة.
        run: |
          set -euo pipefail
          CRED_FILE="${HOME}/.hf-git-credentials"
          umask 077
          printf 'https://DrAbdulmalek:%s@huggingface.co\n' "$HF_TOKEN" > "$CRED_FILE"
          chmod 600 "$CRED_FILE"
          git config --global credential.https://huggingface.co.helper "store --file=$CRED_FILE"
          echo "CRED_FILE=$CRED_FILE" >> "$GITHUB_ENV"
          # fail-fast إن لم يكن git-lfs متاحًا بدل إخفاء الفشل
          if ! command -v git-lfs >/dev/null 2>&1; then
            echo "::warning::git-lfs is not installed — LFS objects will not be pulled"
          fi

      - name: Clone HF Space
        run: |
          set -euo pipefail
          git clone "https://huggingface.co/spaces/DrAbdulmalek/omni-medical-ocr" hf-space-deploy
          cd hf-space-deploy
          # التحقق من نظافة remote بعد الاستنساخ (لا يجوز أن يحمل بيانات اعتماد)
          ORIGIN="$(git remote get-url origin)"
          case "$ORIGIN" in
            *"://"*":"*"@"*) echo "::error::origin embeds credentials — aborting"; exit 1 ;;
          esac
          if command -v git-lfs >/dev/null 2>&1; then git lfs pull; fi

      - name: Sync all hf-space files
        run: |
          cd hf-space-deploy

          # Remove old generated files
          rm -rf src/ packages/ config/ app_services/

          # Copy ALL deployment artifacts from monorepo
          cp -f ../hf-space/app.py ./app.py
          cp -f ../hf-space/Dockerfile ./Dockerfile
          cp -f ../hf-space/requirements.txt ./requirements.txt
          cp -r ../hf-space/src/ ./src/
          cp -r ../hf-space/packages/ ./packages/
          cp -r ../hf-space/config/ ./config/ 2>/dev/null || mkdir -p config

          # Copy shared services (for adapter imports)
          mkdir -p app_services/services
          cp ../app/services/*.py ./app_services/services/ 2>/dev/null || true
          cp ../app/services/__init__.py ./app_services/services/ 2>/dev/null || true

          # Copy .dockerignore if present
          cp -f ../hf-space/.dockerignore ./.dockerignore 2>/dev/null || true

          echo "=== Synced files ==="
          find . -maxdepth 1 -type f -name "*.py" -o -name "Dockerfile" -o -name "requirements.txt" | sort
          echo "=== Dirs ==="
          echo "src/: $(find src/ -name '*.py' | wc -l) files"
          echo "packages/: $(find packages/ -name '*.py' | wc -l) files"

      - name: Push to HF Spaces
        run: |
          set -euo pipefail
          cd hf-space-deploy
          git add -A
          CHANGED=$(git diff --cached --stat)
          if [ -n "$CHANGED" ]; then
            git commit -m "auto-deploy from omni-medical-suite@${GITHUB_SHA::7}"
            # الدفع إلى remote نظيف؛ الاعتماد يأتي من الـhelper المُعدّ أعلاه
            git push origin main
            echo "✅ Deployed to https://huggingface.co/spaces/DrAbdulmalek/omni-medical-ocr"
          else
            echo "No changes to deploy"
          fi

      - name: Remove credential file
        if: always()
        run: |
          if [ -n "${CRED_FILE:-}" ] && [ -f "$CRED_FILE" ]; then
            shred -u "$CRED_FILE" 2>/dev/null || rm -f "$CRED_FILE"
            echo "removed $CRED_FILE"
          fi
          git config --global --unset credential.https://huggingface.co.helper 2>/dev/null || true