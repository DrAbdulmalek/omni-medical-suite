# =============================================================================
# Auto-Deploy Gradio App to HuggingFace Spaces
# =============================================================================
# Triggers: Push to main when hf-space/ or Dockerfile.gradio changes
# Target: DrAbdulmalek/omni-medical-ocr HF Space
#
# The workflow preserves the HF Space's own Dockerfile and requirements.txt
# and overwrites only app.py, src/, packages/, and config/ from the monorepo.
# =============================================================================

name: Deploy to HuggingFace Spaces

on:
  push:
    branches: [main]
    paths:
      - "hf-space/**"
      - "Dockerfile.gradio"
      - "packages/ocr_core/**"
      - "packages/text_core/**"

concurrency:
  group: hf-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to HF Spaces
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "DrAbdulmalek"
          git config --global user.email "drabdulmalek@proton.me"

      - name: Clone HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone "https://DrAbdulmalek:${HF_TOKEN}@huggingface.co/spaces/DrAbdulmalek/omni-medical-ocr" hf-space-deploy
          cd hf-space-deploy
          git lfs pull 2>/dev/null || true

      - name: Sync application files
        run: |
          cd hf-space-deploy

          # Preserve HF Space's own Dockerfile and requirements.txt
          # (they may have HF-specific customizations)
          echo "Preserving existing Dockerfile and requirements.txt"

          # Copy updated application code from monorepo
          cp -f ../hf-space/app.py ./app.py
          rm -rf src/ packages/ config/
          cp -r ../hf-space/src/ ./src/
          cp -r ../hf-space/packages/ ./packages/
          cp -r ../hf-space/config/ ./config/ 2>/dev/null || mkdir -p config

          # List synced files
          echo "=== Synced files ==="
          find . -maxdepth 2 -type f | head -30

      - name: Push to HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd hf-space-deploy
          git add -A
          git diff --cached --quiet || git commit -m "auto-deploy from omni-medical-suite@${GITHUB_SHA::7}"
          git push "https://DrAbdulmalek:${HF_TOKEN}@huggingface.co/spaces/DrAbdulmalek/omni-medical-ocr" main
          echo "Deployed to https://huggingface.co/spaces/DrAbdulmalek/omni-medical-ocr"