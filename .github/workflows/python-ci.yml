name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-asyncio pytest-cov
        pip install gradio httpx python-jose passlib bcrypt python-multipart
        pip install -r requirements/api.txt
        pip install -r requirements/ml.txt
    
    - name: Run tests
      env:
        ENVIRONMENT: development
        DEBUG: 'true'
        JWT_SECRET_KEY: 'ci-test-secret-key-32-chars-long!!'
      run: |
        python -m pytest tests/ -v --tb=short \
          --ignore=tests/test_build_training_data.py \
          --ignore=tests/test_mobile_review_server.py \
          --ignore=tests/integration/test_auth_postgres.py \
          --ignore=tests/test_arabic_nlp_utils.py \
          --ignore=tests/test_engine_router_advanced.py \
          --ignore=tests/test_integration.py
    
    - name: Code Quality Checks
      run: |
        pip install flake8 black
        flake8 app/ hf-space/ src/ packages/ --count --select=E999,F811 --show-source --statistics
        black --check app/ hf-space/ src/ packages/ 2>/dev/null || true
        # black --check is informational for now; critical flake8 errors above are the gate
