name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: security-fixes-clean
        fetch-depth: 1

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Apply security fixes to actual checkout
      if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'security-fixes-clean'
      run: |
        python - <<'PY'
        from pathlib import Path
        p = Path('hf-space/app_core.py')
        s = p.read_text(encoding='utf-8')
        for wrong, right in [
            ('ديكلوفيناك ', 'ديكلوفيناك'), ('اوميبرازول ', 'اوميبرازول'),
            ('سيليبريكس ', 'سيليبريكس'), ('ترامادول ', 'ترامادول'),
            ('كاتافلام ', 'كاتافلام'), ('نوفافين ', 'نوفافين'),
            ('فلاميكس ', 'فلاميكس'), ('بنادول ', 'بنادول'), ('ادفيل ', 'ادفيل'),
        ]:
            s = s.replace(f'"{wrong}": "{right}"', f'"{right}": "{right}"')
        p.write_text(s, encoding='utf-8')

        p = Path('app/routers/admin.py')
        s = p.read_text(encoding='utf-8')
        if 'Depends(get_current_user)' not in s:
            s = s.replace('from fastapi import APIRouter\n', 'from fastapi import APIRouter, Depends\nfrom app.core.security import get_current_user\nfrom app.db.models.auth import User\n', 1)
            s = s.replace('async def system_status():', 'async def system_status(current_user: User = Depends(get_current_user)):', 1)
        p.write_text(s, encoding='utf-8')

        old = Path('deploy/docker-compose.prod.yml')
        new = Path('deploy/docker-compose.full.yml')
        if old.exists() and not new.exists():
            old.rename(new)
        p = Path('deploy/deploy.sh')
        s = p.read_text(encoding='utf-8')
        old_block = '''if [[ -f "${DEPLOY_DIR}/docker-compose.prod.yml" ]]; then
    cp "${DEPLOY_DIR}/docker-compose.prod.yml" "${PROJECT_DIR}/docker-compose.prod.yml"
fi'''
        if old_block in s:
            s = s.replace(old_block, '''COMPOSE_FILE="${DEPLOY_DIR}/docker-compose.full.yml"
if [[ ! -f "$COMPOSE_FILE" ]]; then
    error "Full-stack compose file not found: $COMPOSE_FILE"
fi''', 1)
        if 'COMPOSE_FILE=' not in s:
            s = s.replace('DEPLOY_DIR="$(dirname "$0")"\n', 'DEPLOY_DIR="$(dirname "$0")"\nCOMPOSE_FILE="${DEPLOY_DIR}/docker-compose.full.yml"\n', 1)
        s = s.replace('docker compose -f docker-compose.prod.yml', 'docker compose --project-directory "$PROJECT_DIR" -f "$COMPOSE_FILE"')
        p.write_text(s, encoding='utf-8')
        PY

        mkdir -p tests/security
        cat > tests/security/test_medical_behavior.py <<'PY'
        import sys
        from pathlib import Path
        sys.path.insert(0, str(Path(__file__).resolve().parents[2] / 'hf-space'))
        import app_core

        def test_tramadol_dose_separator_preserved():
            out, _ = app_core._auto_correct_ocr('ترامادول 0.5 mg')
            assert out == 'ترامادول 0.5 mg'

        def test_medical_negation_and_dose_preserved():
            text = 'لا يعطى ترامادول 0.5 mg'
            out, _ = app_core._auto_correct_ocr(text)
            assert out == text

        def test_decimals_preserved():
            for text in ['0.5', '1.25', '0.75', '٠٫٥', '١٫٢٥']:
                out, _ = app_core._auto_correct_ocr(text)
                assert out == text

        def test_negations_preserved():
            for text in ['لا', 'ليس', 'لم', 'لن', 'غير', 'بدون', 'لا يوجد سكري']:
                out, _ = app_core._auto_correct_ocr(text)
                assert out == text

        def test_intended_ocr_correction_remains():
            out, _ = app_core._auto_correct_ocr('باراسيتبمول 500 mg')
            assert out == 'باراسيتامول 500 mg'
        PY

        python -m pip install --disable-pip-version-check pytest numpy opencv-python-headless 'gradio<6' >/dev/null
        pytest -q tests/security/test_medical_behavior.py
        test -f deploy/docker-compose.full.yml
        test -f docker-compose.prod.yml
        ! grep -q 'cp .*docker-compose.prod.yml.*docker-compose.prod.yml' deploy/deploy.sh
        grep -q 'docker-compose.full.yml' deploy/deploy.sh
        grep -q 'Depends(get_current_user)' app/routers/admin.py
        ! grep -q '"ترامادول ": "ترامادول"' hf-space/app_core.py

        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add hf-space/app_core.py app/routers/admin.py deploy/deploy.sh deploy/docker-compose.full.yml tests/security/test_medical_behavior.py
        git diff --cached --check
        git commit -m 'Security fixes: medical OCR separator, admin auth, deployment topology' || true
        git push origin security-fixes-clean

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short || echo "No tests found"

    - name: Code Quality Checks
      run: |
        pip install flake8 black
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
        black . --check --verbose || true
