name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-asyncio pytest-cov
        pip install gradio httpx python-jose passlib bcrypt python-multipart
        pip install -r requirements/api.txt
        pip install -r requirements/ml.txt
    
    - name: Run tests
      env:
        ENVIRONMENT: development
        DEBUG: 'true'
        JWT_SECRET_KEY: 'ci-test-secret-key-32-chars-long!!'
      run: |
        python -m pytest tests/ -v --tb=short \
          --ignore=tests/test_build_training_data.py \
          --ignore=tests/test_mobile_review_server.py \
          --ignore=tests/integration/ \
          --ignore=tests/test_e2e.py \
          --ignore=tests/test_htr.py \
          --ignore=tests/test_integration.py \
          --ignore=tests/test_integration_full.py \
          --ignore=tests/test_api_performance.py \
          --ignore=tests/test_ocr_engine.py \
          --ignore=tests/test_performance.py \
          --ignore=tests/test_pr92_production_specialty_runtime.py \
          --ignore=tests/test_sensitive_scanner.py \
          --ignore=tests/test_summarizer.py
    
    - name: Code Quality Checks
      run: |
        pip install flake8 black
        flake8 app/ hf-space/ src/ --count --select=E999 --show-source --statistics
        black --check app/ hf-space/ src/ 2>/dev/null || true
        # black --check is informational for now; critical flake8 errors above are the gate
