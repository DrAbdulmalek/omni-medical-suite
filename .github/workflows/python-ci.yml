name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    # LFS fetch (~100s) + apt tesseract + dependency install + ~900 tests.
    # Bounded explicitly: an unbounded job hides a hang for 6 hours.
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
      with:
        # LFS: golden_set/*.jsonl والصور تحت LFS؛ بلا هذا
        # تصل مؤشرات 129 بايت فتفشل tests/evaluation/ بـJSONDecodeError
        lfs: true
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    # tests/evaluation/test_golden_harness.py shells out to the real `tesseract`
    # binary (packages/evaluation/golden_harness.py -> subprocess.run(["tesseract", ...])).
    # Without this step the job dies with:
    #   FileNotFoundError: [Errno 2] No such file or directory: 'tesseract'
    # on test_harness_two_runs_stable + test_every_row_records_sha256_and_excludes_confidence.
    # Mirrors lint-test.yml ("Unit Tests"), which installs the same packages and passes.
    #
    # Deliberately NOT `|| true` and deliberately NOT a pytest skip: the golden
    # harness is a measurement gate whose contract is to fail loudly on a broken
    # environment ("لا نتائج فارغة صامتة"). Skipping on a missing binary would turn
    # a red gate silently green — the exact false-green this repo already guards
    # against in tests/security/test_ci_false_green.py.
    - name: Install system dependencies (Tesseract OCR)
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng libtesseract-dev

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-asyncio pytest-cov
        pip install gradio httpx python-jose passlib bcrypt python-multipart
        pip install -r requirements/api.txt
        pip install -r requirements/ml.txt
    
    - name: Run tests
      env:
        ENVIRONMENT: development
        DEBUG: 'true'
        JWT_SECRET_KEY: 'ci-test-secret-key-32-chars-long!!'
      run: |
        python -m pytest tests/ -v --tb=short \
          --ignore=tests/test_build_training_data.py \
          --ignore=tests/test_mobile_review_server.py \
          --ignore=tests/integration/ \
          --ignore=tests/test_e2e.py \
          --ignore=tests/test_htr.py \
          --ignore=tests/test_integration.py \
          --ignore=tests/test_integration_full.py \
          --ignore=tests/test_api_performance.py \
          --ignore=tests/test_ocr_engine.py \
          --ignore=tests/test_performance.py \
          --ignore=tests/test_pr92_production_specialty_runtime.py \
          --ignore=tests/test_sensitive_scanner.py \
          --ignore=tests/test_summarizer.py
    
    - name: Code Quality Checks
      run: |
        pip install flake8 black
        flake8 app/ hf-space/ src/ --count --select=E999 --show-source --statistics
        black --check app/ hf-space/ src/ 2>/dev/null || true
        # black --check is informational for now; critical flake8 errors above are the gate
