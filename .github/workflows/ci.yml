name: CI — OmniMedical Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ===================================================================
  # Job 1: Lint with ruff
  # ===================================================================
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check src/ packages/ app/ tests/ scripts/

      - name: Run ruff format check
        run: ruff format --check src/ packages/ app/ tests/ scripts/

  # ===================================================================
  # Job 2: Type check with mypy
  # ===================================================================
  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt 2>/dev/null || true
          pip install -r requirements-dev.txt 2>/dev/null || true
          pip install mypy

      - name: Run mypy
        run: mypy src/ packages/core packages/nlp packages/security packages/evaluation --config-file mypy.ini
        continue-on-error: true

  # ===================================================================
  # Job 3a: Critical smoke tests (must pass — blocks merge)
  # ===================================================================
  test-critical:
    name: Critical Tests (RTL + Qdrant Fallback + Core)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install core dependencies
        run: pip install pytest rapidfuzz numpy

      - name: Run RTL tests
        run: pytest tests/test_arabic_rtl.py -v --tb=short

      - name: Run Qdrant fallback tests (no Qdrant required)
        run: pytest tests/test_qdrant_search.py::TestQdrantMedicalSearchFallback -v --tb=short

      - name: Run field extractor tests
        run: pytest tests/test_field_extractor_core.py -v --tb=short 2>/dev/null || true

      - name: Run weighted dedup tests
        run: pytest tests/test_weighted_dedup.py -v --tb=short 2>/dev/null || true

      - name: Run RTL fix pipeline test
        run: pytest tests/test_rtl_fix_pipeline.py -v --tb=short 2>/dev/null || true

  # ===================================================================
  # Job 3: Unit tests (non-blocking — informational)
  # ===================================================================
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        test-group:
          - name: core
            path: tests/unit/test_core.py
          - name: medical
            path: tests/unit/test_medical.py
          - name: nlp
            path: tests/unit/test_nlp.py
          - name: security
            path: tests/unit/test_security.py
          - name: evaluation
            path: tests/unit/test_evaluation.py
          - name: existing
            path: tests/
            extra-args: >
              --ignore=tests/unit
              --ignore=tests/integration
              --ignore=tests/loadtest
              --ignore=tests/dictionaries
              --ignore-glob="**/test_api*"
              --ignore-glob="**/test_integration*"
              --ignore-glob="**/test_e2e*"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ara 2>/dev/null || true

      - name: Install Python dependencies
        run: |
          pip install pytest pytest-cov pytest-asyncio rapidfuzz numpy
          pip install -r requirements.txt 2>/dev/null || true
          pip install -r requirements-dev.txt 2>/dev/null || true

      - name: Run ${{ matrix.test-group.name }} tests
        run: |
          pytest ${{ matrix.test-group.path }} ${{ matrix.test-group.extra-args }} \
            -x -q --tb=short \
            --ignore=tests/loadtest \
            --ignore=tests/dictionaries \
            2>&1 || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.test-group.name }}
          path: |
            .pytest_cache/
            htmlcov/
          retention-days: 7
          if-no-files-found: ignore

  # ===================================================================
  # Job 4: Integration tests (main branch only)
  # ===================================================================
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test-unit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ara 2>/dev/null || true
          pip install pytest pytest-cov pytest-asyncio
          pip install -r requirements.txt 2>/dev/null || true
          pip install -r requirements-dev.txt 2>/dev/null || true

      - name: Run integration tests
        run: |
          pytest tests/integration/ tests/test_integration.py tests/test_integration_full.py \
            -x -q --tb=short -m integration 2>&1 || true

  # ===================================================================
  # Job 5: Build Docker images (main branch only)
  # ===================================================================
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test-unit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image
        run: docker build -f Dockerfile.api -t omni-medical-api:ci-test .

      - name: Build Gradio image
        run: docker build -f Dockerfile -t omni-medical-gradio:ci-test .

      - name: Verify images
        run: |
          echo "=== Built images ==="
          docker images omni-medical-* --format "table {{.Repository}}:{{.Tag}}\t{{.Size}}\t{{.CreatedSince}}"

  # ===================================================================
  # Job 6: Security scan
  # ===================================================================
  security:
    name: Security Scan (bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit scan
        run: |
          bandit -r src/ packages/ app/ scripts/ \
            -ll \
            -x packages/omniparse,packages/omni-ocr,packages/ocr_postprocess/vendor,tests \
            -f json -o bandit-report.json || true
          bandit -r src/ packages/ app/ scripts/ \
            -ll \
            -x packages/omniparse,packages/omni-ocr,packages/ocr_postprocess/vendor,tests \
            || true

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30
          if-no-files-found: ignore

  # ===================================================================
  # Job 7: Final status check (for branch protection)
  # ===================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-unit, test-critical, security]
    if: always()
    steps:
      - name: Check all required jobs passed
        run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "TypeCheck: ${{ needs.typecheck.result }}"
          echo "UnitTests: ${{ needs.test-unit.result }}"
          echo "CriticalTests: ${{ needs.test-critical.result }}"
          echo "Security: ${{ needs.security.result }}"
          if [[ "${{ needs.lint.result }}" == "failure" ]]; then exit 1; fi
          if [[ "${{ needs.test-critical.result }}" == "failure" ]]; then exit 1; fi
          echo "All required CI checks passed!"