name: CI — OmniMedical Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-python:
    name: Lint Python (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff mypy
      - run: ruff check .
      - run: mypy . --ignore-missing-imports || echo "mypy: no type stubs found"

  test-python:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint-python
    defaults:
      run:
        working-directory: services/api
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt 2>/dev/null || pip install fastapi pytest
      - run: pytest --tb=short || echo "No tests yet"

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint || echo "No lint script yet"

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: lint-frontend
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test || echo "No tests yet"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for hardcoded passwords & secrets
        run: |
          echo "=== Scanning for hardcoded passwords and secrets ==="
          PATTERNS=(
            'admin123'
            'password\s*=\s*["\x27][^"\x27]*(admin|password|secret|123456|qwerty)[^"\x27]*["\x27]'
            'SECRET_KEY\s*=\s*["\x27][^"\x27]+["\x27]'
            'TOKEN\s*=\s*["\x27][^"\x27]+["\x27]'
            'AKIA[0-9A-Z]{16}'
            'ghp_[A-Za-z0-9]{36}'
            '-----BEGIN (RSA |DSA |EC )?PRIVATE KEY-----'
          )
          FOUND=0
          for PATTERN in "${PATTERNS[@]}"; do
            MATCHES=$(git grep -il "$PATTERN" -- '*.py' '*.ts' '*.tsx' '*.js' '*.jsx' '*.env*' '*.yml' '*.yaml' '*.json' 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              echo "⚠️  Found pattern '$PATTERN' in:"
              echo "$MATCHES"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "❌ SECURITY ISSUE: Hardcoded secrets detected!"
            exit 1
          else
            echo "✅ No hardcoded secrets found."
          fi

  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: [test-python, test-frontend, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Check for docker-compose
        run: ls docker-compose*.yml 2>/dev/null || echo "No docker-compose found"

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [lint-python, test-python, lint-frontend, test-frontend, security-scan, build]
    steps:
      - name: Check all jobs passed
        run: |
          echo "lint-python:       ${{ needs.lint-python.result }}"
          echo "test-python:       ${{ needs.test-python.result }}"
          echo "lint-frontend:     ${{ needs.lint-frontend.result }}"
          echo "test-frontend:     ${{ needs.test-frontend.result }}"
          echo "security-scan:     ${{ needs.security-scan.result }}"
          echo "build:             ${{ needs.build.result }}"
          if [[ "${{ needs.lint-python.result }}" == "failure" ]] || \
             [[ "${{ needs.test-python.result }}" == "failure" ]] || \
             [[ "${{ needs.lint-frontend.result }}" == "failure" ]] || \
             [[ "${{ needs.test-frontend.result }}" == "failure" ]] || \
             [[ "${{ needs.security-scan.result }}" == "failure" ]] || \
             [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "❌ CI Gate FAILED"
            exit 1
          fi
          echo "✅ CI Gate PASSED"
