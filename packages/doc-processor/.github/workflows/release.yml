name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Build Web Application
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Medical Doc Suite v${{ steps.version.outputs.VERSION }}"
          body: |
            ## Medical Doc Suite v${{ steps.version.outputs.VERSION }}

            ### What's Changed
            - Web application improvements
            - Desktop application enhancements
            - Core algorithm optimizations
            - Bug fixes and stability improvements

            ### Installation
            ```bash
            git clone https://github.com/DrAbdulmalek/medical-doc-processor.git
            cd medical-doc-processor
            bun install
            bun run dev
            ```
          draft: false
          prerelease: false
