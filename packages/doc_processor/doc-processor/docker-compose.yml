services:
  python-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medical-doc-processor
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
    volumes:
      - medical-data:/tmp/medical_docs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  medical-data:
