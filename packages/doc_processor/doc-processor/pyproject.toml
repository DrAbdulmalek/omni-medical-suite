[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-doc-processor-alt"
version = "3.2.0"
description = "معالج الوثائق الطبية — مسح + OCR + تصنيف + تشفير (legacy symlink)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Dr. Abdulmalek Tamer Al-husseini", email = "Abdulmalek.husseini@gmail.com"}]
requires-python = ">=3.10"
keywords = ["medical", "documents", "ocr", "fhir", "encryption"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science",
]
dependencies = [
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "Pillow>=10.0.0",
    "PyQt5>=5.15.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "PyMuPDF>=1.23.0",
    "fpdf2>=2.7.0",
    "rapidfuzz>=3.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
]
ocr = [
    "pytesseract>=0.3.10",
    "imagehash>=4.3.0",
]
security = [
    "cryptography>=41.0.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
]
ai = [
    "mistralai>=1.0.0",
    "fhir.resources>=8.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]
full = ["medical-doc-processor-alt[api,ocr,security]"]

[project.urls]
Homepage = "https://github.com/DrAbdulmalek/omni-medical-suite"
Repository = "https://github.com/DrAbdulmalek/omni-medical-suite"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
