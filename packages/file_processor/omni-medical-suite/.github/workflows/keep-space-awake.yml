name: Keep HF Spaces Awake

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping handwriting-ocr Space
        run: curl -s -o /dev/null -w "%{http_code}" https://drabdulmalek-handwriting-ocr.hf.space

      - name: Ping medical-ocr-trainer Space
        run: curl -s -o /dev/null -w "%{http_code}" https://drabdulmalek-medical-ocr-trainer.hf.space
