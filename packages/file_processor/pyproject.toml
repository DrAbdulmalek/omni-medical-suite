[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnifile-processor"
version = "4.3.0"
description = "معالج مستندات OCR ذكي يدعم العربية — 5 محركات + NLP + تصدير"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Dr. Abdulmalek Tamer Al-husseini", email = "Abdulmalek.husseini@gmail.com"}]
requires-python = ">=3.10"
keywords = ["ocr", "arabic", "nlp", "document-processing", "handwriting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Natural Language :: Arabic",
]
dependencies = [
    "google-generativeai>=0.3.0",
    "tenacity>=8.2.0",
    "streamlit>=1.29.0",
    "gradio>=4.0.0",
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "filelock>=3.13.0",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
    "Pillow>=10.0.0",
    "openpyxl>=3.1.0",
    "markdown>=3.5.0",
    "flask>=3.0.0",
    "fpdf2>=2.7.0",
    "psutil>=5.9.0",
    "matplotlib>=3.8.0",
    "GitPython>=3.1.0",
    "beautifulsoup4>=4.12.0",
    "tokenizers>=0.19.0",
    "opencv-python>=4.9.0",
    "pyyaml>=6.0.0",
    "jinja2>=3.1.0",
    "symspellpy>=6.7.0",
]

[project.optional-dependencies]
ocr = [
    "python-multipart>=0.0.6",
    "easyocr>=1.7.0",
    "pytesseract>=0.3.10",
    "PyMuPDF>=1.23.0",
    "pdf2image>=1.16.0",
    "opencv-python-headless>=4.8.0",
    "rapidfuzz>=3.0.0",
    "python-docx>=0.8.11",
    "surya-ocr>=0.4.0",
    "timm>=0.9.0",
    "accelerate>=0.25.0",
    "onnxruntime>=1.16.0",
    "scikit-image>=0.21.0",
    "paddlepaddle>=2.5.0",
    "paddleocr>=2.7.0",
    "aiofiles>=23.2.1",
]
nlp = [
    "transformers>=4.36.0",
    "peft>=0.7.0",
    "sentencepiece>=0.1.99",
    "huggingface_hub>=0.19.0",
    "langdetect>=1.0.9",
    "pyspellchecker>=0.7.2",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.4.2",
    "jiwer>=3.0.0",
    "torch>=2.1.0",
    "ar-corrector>=0.6.3",
    "language-tool-python>=2.7.0",
    "datasets>=2.15.0",
    "torchvision>=0.15.0",
    "scikit-learn>=1.3.0",
]
gateway = [
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "markdown-it-py>=4.2.0",
    "tiktoken>=0.7.0",
    "loguru>=0.7.0",
    "aiohttp>=3.13.4",
]
deployment = [
    "structlog>=23.2.0",
    "cryptography>=41.0.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "prometheus-client>=0.19.0",
    "gunicorn>=21.2.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "detect-secrets>=1.4.0",
    "slowapi>=0.1.9",
    "pyotp>=2.9.0",
]
hf = [
    "easyocr>=1.7.0",
    "pytesseract>=0.3.10",
    "transformers>=4.36.0",
    "torch>=2.1.0",
    "PyMuPDF>=1.23.0",
    "python-docx>=0.8.11",
    "openpyxl>=3.1.0",
    "langdetect>=1.0.9",
    "pyspellchecker>=0.7.2",
    "ar-corrector>=0.6.3",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.4.2",
    "jiwer>=3.0.0",
    "sentencepiece>=0.1.99",
]
colab = [
    "pyngrok>=7.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "black>=24.0.0",
    "isort>=5.13.0",
]
training = [
    "bitsandbytes>=0.43.0",
    "trl>=0.9.0",
    "wandb>=0.17.0",
    "tensorboard>=2.15.0",
    "albumentations>=1.4.0",
    "editdistance>=0.8.0",
    "optimum>=1.20.0",
    "lmdb>=1.4.1",
    "pyarrow>=16.0.0",
    "onnx>=1.16.0",
    "onnxruntime-gpu>=1.18.0",
]
full = ["omnifile-processor[ocr,nlp,gateway,deployment]"]

[project.scripts]
omnifile = "src.main:main"
omnifile-gateway = "modules.ai.gateway.server:main"

[project.urls]
# ARCHIVED: OmniFile_Processor merged into omni-medical-suite
Homepage = "https://github.com/DrAbdulmalek/omni-medical-suite"
Repository = "https://github.com/DrAbdulmalek/omni-medical-suite"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
