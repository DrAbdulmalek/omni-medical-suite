[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scanner-fixer"
version = "1.2.0"
description = "Pre-OCR image normalization and PDF OCR processing for scanned medical documents"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "DrAbdulmalek" }]
requires-python = ">=3.9"

dependencies = [
    "numpy>=1.24.0,<2.0.0; python_version < '3.14'",
    "numpy>=2.0.0,<3.0.0; python_version >= '3.14'",
    "opencv-python>=4.7",
    "click>=8.0",
    "Pillow>=9.0",
    "imagehash>=4.0",
]

[project.optional-dependencies]
tesseract = ["pytesseract>=0.3"]
pdf = ["PyMuPDF>=1.22", "pdf2image>=1.16", "pdfplumber>=0.9"]
ocr = ["pytesseract>=0.3", "paddleocr>=2.6", "easyocr>=1.6"]
all = ["scanner-fixer[pdf,ocr]"]
dev = ["pytest>=7.0", "pytest-cov", "ruff", "black"]

[project.scripts]
scanner-fixer = "scanner_fixer.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
