# alembic.ini - Database migration configuration
[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}

# Additional configuration
file_template = %%(rev)s_%%(slug)s
python_file_template = %%(module)s_%%(rev)s_%%(slug)s
sql_file_template = %%(rev)s_%%(slug)s
render_as_batch = true
sqlalchemy.echo = false

# Version table name
version_table = alembic_version

# Run migrations in transactional mode
run_migrations_in_transaction = true

# Log configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
datefmt = %Y-%m-%d %H:%M:%S