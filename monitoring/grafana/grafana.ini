# =============================================================================
# Grafana Server Configuration — OmniMedical Suite
# =============================================================================
# Configured for Arabic (RTL) locale with custom CSS injection.
# =============================================================================

[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[server]
domain = localhost
root_url = %(protocol)s://%(domain)s:%(http_port)s/

[users]
# Disable user signup — only admin can create accounts
allow_sign_up = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/omnimedical_success_dashboard.json

[security]
admin_user = admin
admin_password = admin

[log]
mode = console file
level = info

[log.console]
format = console

[log.file]
level = info
path = /var/log/grafana/grafana.log
max_days = 7

[database]
# SQLite database path
type = sqlite3
path = /var/lib/grafana/grafana.db

[session]
provider = file

[locale]
# Default language — Arabic
default_language = ar

[panels]
# Allow unsafe CSS injection in panel plugins (needed for custom RTL CSS)
disable_sanitize_css = true

# NOTE: Custom CSS is served by mounting /etc/grafana/custom-rtl.css
#       into the Grafana container and loading it via a provisioning
#       dashboard annotation or HTML panel.  The CSS file lives at
#       monitoring/grafana/custom-rtl.css in the repository.