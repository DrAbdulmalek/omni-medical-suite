apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omnimedical-ingress
  namespace: omnimedical
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"  # Requires cert-manager
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.omnimedical.ai
        - app.omnimedical.ai
        - grafana.omnimedical.ai
        - prometheus.omnimedical.ai
      secretName: omnimedical-tls
  rules:
    - host: api.omnimedical.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: omnimedical-api
                port:
                  number: 8000
    - host: app.omnimedical.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: omnimedical-api
                port:
                  number: 7860
    - host: grafana.omnimedical.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: omnimedical-grafana
                port:
                  number: 3000
    - host: prometheus.omnimedical.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: omnimedical-prometheus
                port:
                  number: 9090
---
# NetworkPolicy for security (restrict pod-to-pod communication)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omnimedical-default-deny
  namespace: omnimedical
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-ingress
  namespace: omnimedical
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 7860
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-egress
  namespace: omnimedical
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: qdrant
      ports:
        - protocol: TCP
          port: 6333
