version: "3.9"

# =============================================================================
# OmniMedical Suite v2.0 — Development Environment
# Hot-reload, debug mode, volume mounts for live code editing
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # API + Gradio (Development Mode)
  # ---------------------------------------------------------------------------
  omnimedical-api-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development  # Uses development stage with hot-reload
    container_name: omnimedical-api-dev
    ports:
      - "8000:8000"      # FastAPI
      - "7860:7860"      # Gradio UI
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql://postgres:postgres@postgres-dev:5432/omnimedical
      - REDIS_URL=redis://redis-dev:6379/0
      - QDRANT_HOST=qdrant-dev
      - QDRANT_PORT=6333
      - CORRECTION_DB_PATH=/data/corrections_v2.db
      - MODEL_CACHE=/models
      - LOG_LEVEL=DEBUG
      - WORKERS=1
      - AUTO_PROMOTION_ENABLED=true
      - PROMOTION_FREQUENCY_THRESHOLD=2  # Lower threshold for faster testing
      - PROMOTION_MAX_AGE_DAYS=1         # Faster promotion cycle
    volumes:
      # Live code editing — changes reflect immediately
      - ./app:/app/app:ro
      - ./tests:/app/tests:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      # Persistent data
      - dev_data:/data
      - model_cache:/models
      # Upload temp directory
      - /tmp/uploads:/tmp/uploads
    depends_on:
      postgres-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
      qdrant-dev:
        condition: service_started
    networks:
      - omnimedical-dev-net
    # Override command for hot-reload
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app
    # Development tools
    stdin_open: true
    tty: true

  # ---------------------------------------------------------------------------
  # PostgreSQL (Development)
  # ---------------------------------------------------------------------------
  postgres-dev:
    image: postgres:16-alpine
    container_name: omnimedical-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: omnimedical
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - omnimedical-dev-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d omnimedical"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis (Development)
  # ---------------------------------------------------------------------------
  redis-dev:
    image: redis:7-alpine
    container_name: omnimedical-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - omnimedical-dev-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  # ---------------------------------------------------------------------------
  # Qdrant (Development)
  # ---------------------------------------------------------------------------
  qdrant-dev:
    image: qdrant/qdrant:v1.8.0
    container_name: omnimedical-qdrant-dev
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_dev_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    networks:
      - omnimedical-dev-net

  # ---------------------------------------------------------------------------
  # Prometheus (Development — optional)
  # ---------------------------------------------------------------------------
  prometheus-dev:
    image: prom/prometheus:v2.50.0
    container_name: omnimedical-prometheus-dev
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus-rules.yml:/etc/prometheus/rules.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    networks:
      - omnimedical-dev-net
    profiles: ["monitoring"]  # Only start with: docker-compose --profile monitoring up

  # ---------------------------------------------------------------------------
  # Grafana (Development — optional)
  # ---------------------------------------------------------------------------
  grafana-dev:
    image: grafana/grafana:10.3.1
    container_name: omnimedical-grafana-dev
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=true  # Allow dev signups
      - GF_AUTH_ANONYMOUS_ENABLED=true  # Anonymous access for dev
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana_dev_data:/var/lib/grafana
      - ./config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - omnimedical-dev-net
    profiles: ["monitoring"]

  # ---------------------------------------------------------------------------
  # Mailhog (Email catching for development)
  # ---------------------------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:latest
    container_name: omnimedical-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - omnimedical-dev-net
    profiles: ["email"]

  # ---------------------------------------------------------------------------
  # pgAdmin (Database management — optional)
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: omnimedical-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@omnimedical.ai
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - omnimedical-dev-net
    profiles: ["db-tools"]

  # ---------------------------------------------------------------------------
  # Redis Commander (Redis UI — optional)
  # ---------------------------------------------------------------------------
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: omnimedical-redis-commander
    environment:
      - REDIS_HOSTS=local:redis-dev:6379
    ports:
      - "8081:8081"
    networks:
      - omnimedical-dev-net
    profiles: ["db-tools"]

networks:
  omnimedical-dev-net:
    driver: bridge

volumes:
  dev_data:
  model_cache:
  postgres_dev_data:
  redis_dev_data:
  qdrant_dev_data:
  grafana_dev_data:
  pgadmin_data:
