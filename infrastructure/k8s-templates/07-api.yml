apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnimedical-api
  namespace: omnimedical
  labels:
    app: api
spec:
  replicas: 3  # Scale horizontally
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
        # Wait for dependencies
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z omnimedical-postgres 5432; do echo waiting for postgres; sleep 2; done;']
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z omnimedical-redis 6379; do echo waiting for redis; sleep 2; done;']
        - name: wait-for-qdrant
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z omnimedical-qdrant 6333; do echo waiting for qdrant; sleep 2; done;']
      containers:
        - name: api
          image: omnimedical/api:v2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: fastapi
            - containerPort: 7860
              name: gradio
          envFrom:
            - configMapRef:
                name: omnimedical-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: omnimedical-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: omnimedical-secrets
                  key: JWT_SECRET
            - name: AES_KEY
              valueFrom:
                secretKeyRef:
                  name: omnimedical-secrets
                  key: AES_KEY
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: correction-data
              mountPath: /data
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "8Gi"
              cpu: "4000m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
        - name: correction-data
          emptyDir: {}  # Use PVC for persistence across restarts
---
apiVersion: v1
kind: Service
metadata:
  name: omnimedical-api
  namespace: omnimedical
spec:
  selector:
    app: api
  ports:
    - name: fastapi
      port: 8000
      targetPort: 8000
    - name: gradio
      port: 7860
      targetPort: 7860
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: omnimedical-api-hpa
  namespace: omnimedical
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: omnimedical-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
