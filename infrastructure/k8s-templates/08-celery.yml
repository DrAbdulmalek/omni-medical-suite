apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnimedical-celery-worker
  namespace: omnimedical
  labels:
    app: celery-worker
spec:
  replicas: 4
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
        - name: worker
          image: omnimedical/api:v2.0.0
          command: ["celery", "-A", "app.tasks", "worker", "--loglevel=info", "--concurrency=4"]
          envFrom:
            - configMapRef:
                name: omnimedical-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: omnimedical-secrets
                  key: DATABASE_URL
          volumeMounts:
            - name: model-cache
              mountPath: /models
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
---
# Celery Beat (Scheduler)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnimedical-celery-beat
  namespace: omnimedical
  labels:
    app: celery-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      containers:
        - name: beat
          image: omnimedical/api:v2.0.0
          command: ["celery", "-A", "app.tasks", "beat", "--loglevel=info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
          envFrom:
            - configMapRef:
                name: omnimedical-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: omnimedical-secrets
                  key: DATABASE_URL
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
