# mypy.ini — OmniMedical Suite type checking configuration
# Documentation: https://mypy.readthedocs.io/

[mypy]
# Target Python version
python_version = 3.11

# Strictness level — balanced for a monorepo with mixed code quality
# Start moderate, increase strictness over time
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True

# Disallow untyped defs in new code (but allow in existing)
# disallow_untyped_defs = True  # Enable incrementally

# Basic error settings
strict_optional = True
show_error_codes = True
show_column_numbers = True
show_error_context = True
pretty = True
color_output = True

# ===================================================================
# Per-package overrides
# ===================================================================

# First-party: gradually increase strictness
[mypy-app.*]
ignore_missing_imports = False
disallow_untyped_defs = False

[mypy-src.*]
ignore_missing_imports = False
disallow_untyped_defs = False

[mypy-packages.core.*]
ignore_missing_imports = True
disallow_untyped_defs = False

[mypy-packages.medical.*]
ignore_missing_imports = True
disallow_untyped_defs = False

[mypy-packages.nlp.*]
ignore_missing_imports = True
disallow_untyped_defs = False

[mypy-packages.security.*]
ignore_missing_imports = True
disallow_untyped_defs = False

[mypy-packages.evaluation.*]
ignore_missing_imports = True
disallow_untyped_defs = False

[mypy-packages.ai.*]
ignore_missing_imports = True
disallow_untyped_defs = False

[mypy-packages.ocr_postprocess.*]
ignore_missing_imports = True
disallow_untyped_defs = False

[mypy-packages.segmentation.*]
ignore_missing_imports = True
disallow_untyped_defs = False

[mypy-packages.config.*]
ignore_missing_imports = True
disallow_untyped_defs = False

# Third-party libraries: ignore missing imports (not installed in CI)
[mypy-paddleocr]
ignore_missing_imports = True

[mypy-easyocr]
ignore_missing_imports = True

[mypy-arabic_reshaper]
ignore_missing_imports = True

[mypy-bidi]
ignore_missing_imports = True

[mypy-tesseract]
ignore_missing_imports = True

[mypy-cv2]
ignore_missing_imports = True

[mypy-ar_corrector]
ignore_missing_imports = True

[mypy-rapidfuzz]
ignore_missing_imports = True

[mypy-sklearn]
ignore_missing_imports = True

[mypy-transformers]
ignore_missing_imports = True

[mypy-torch]
ignore_missing_imports = True

[mypy-gemini]
ignore_missing_imports = True

[mypy-google.generativeai]
ignore_missing_imports = True

[mypy-openai]
ignore_missing_imports = True

# Test files: no strict checking needed
[mypy-tests.*]
ignore_errors = True
disallow_untyped_defs = False

# Scripts and tools
[mypy-scripts.*]
ignore_errors = False
disallow_untyped_defs = False
ignore_missing_imports = True

[mypy-tools.*]
ignore_errors = True
disallow_untyped_defs = False

# Exclude directories from type checking
[mypy-omniparse.*]
ignore_errors = True

[mypy-omni_ocr.*]
ignore_errors = True

# Notebooks and legacy
[mypy-notebooks.*]
ignore_errors = True

[mypy-legacy.*]
ignore_errors = True