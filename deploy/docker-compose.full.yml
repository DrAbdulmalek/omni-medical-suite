# =============================================================================
# Omni Medical Suite — Production Docker Compose
# =============================================================================
# Full production stack: API + Gradio HITL + PostgreSQL + Redis + Qdrant
#
# Services:
#   api    — FastAPI REST API (port 8000) — lightweight, no PaddleOCR
#   gradio — Gradio HITL interface (port 7860) — all 5 OCR engines
#   postgres — PostgreSQL 15 database
#   redis    — Redis 7 cache + queue
#   qdrant   — Qdrant vector DB (for search_service.py)
#
# Usage:
#   docker compose -f deploy/docker-compose.full.yml up -d --build
#   docker compose -f deploy/docker-compose.full.yml ps
#   docker compose -f deploy/docker-compose.full.yml logs -f gradio
# =============================================================================

services:
  # ── API Backend (FastAPI — lightweight) ────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: omni-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_SECRET_KEY=${APP_SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-omni_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-omni_medical}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://localhost}
      - CORS_ORIGINS=${CORS_ORIGINS:-[]}
      - OCR_ENGINE_ORDER=tesseract,easyocr
      - OCR_DEVICE=cpu
      - LOG_LEVEL=INFO
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE_MB=50
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=medical_documents
    volumes:
      - uploads_data:/app/uploads
      - results_data:/app/results
      - model_data:/app/model
      - data_dictionaries:/app/data/dictionaries
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - omni-net

  # ── Gradio HITL Interface (Full OCR) ───────────────────────────────────
  # Main user-facing application with all 5 OCR engines
  # PaddleOCR (Arabic), Tesseract, EasyOCR, TrOCR, Surya
  gradio:
    build:
      context: .
      dockerfile: Dockerfile.gradio
      target: production
    container_name: omni-gradio
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_SECRET_KEY=${APP_SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-omni_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-omni_medical}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - OCR_ENGINE_ORDER=paddleocr,tesseract,easyocr
      - OCR_ENGINE=paddleocr
      - TESSERACT_LANGUAGES=ara+eng
      - OCR_DEVICE=cpu
      - OCR_CONFIDENCE_THRESHOLD=0.5
      - OCR_BATCH_SIZE=4
      - ENABLE_LLM=${ENABLE_LLM:-false}
      - ENABLE_MEDICAL_PROTECTION=true
      - PROTECTION_STRICTNESS=high
      - POSTPROCESSOR_ENABLED=true
      - POSTPROCESSOR_PHI_MASKING=true
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE_MB=50
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=medical_documents
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - uploads_data:/app/uploads
      - results_data:/app/results
      - model_data:/app/model
      - data_dictionaries:/app/data/dictionaries
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - omni-net

  # ── PostgreSQL 15 ──────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: omni-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omni_medical}
      POSTGRES_USER: ${POSTGRES_USER:-omni_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omni_user} -d ${POSTGRES_DB:-omni_medical}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omni-net

  # ── Redis 7 ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: omni-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omni-net

  # ── Qdrant Vector DB ───────────────────────────────────────────────────
  # Used by: app/services/search_service.py, app/routers/health.py
  qdrant:
    image: qdrant/qdrant:latest
    container_name: omni-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - omni-net

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  qdrant_data:
    driver: local
  uploads_data:
    driver: local
  results_data:
    driver: local
  model_data:
    driver: local
  data_dictionaries:
    driver: local

networks:
  omni-net:
    driver: bridge
