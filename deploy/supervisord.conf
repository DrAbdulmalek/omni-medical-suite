; =============================================================================
; Omni Medical Suite — Supervisor Configuration
; =============================================================================
; Place at: /etc/supervisor/conf.d/omni-medical.conf
;
; Manages:
;   - FastAPI/Uvicorn API server
;   - Nginx reverse proxy
;
; NOTE: Celery is NOT used in the actual app codebase.
;       Removed celery-worker and celery-beat sections.
; =============================================================================

[supervisord]
nodaemon=false
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

; ── FastAPI API Server ───────────────────────────────────────────────────────
[program:omni-api]
command=/opt/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --loop uvloop --http httptools
directory=/app
user=omni
environment=APP_ENV="production",PYTHONPATH="/app",PATH="/opt/venv/bin:%(ENV_PATH)s"
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/omni-api-stdout.log
stderr_logfile=/var/log/supervisor/omni-api-stderr.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

; ── Nginx ────────────────────────────────────────────────────────────────────
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
stdout_logfile=/var/log/supervisor/nginx-stdout.log
stderr_logfile=/var/log/supervisor/nginx-stderr.log

; ── Group: All Services ─────────────────────────────────────────────────────
[group:omni-medical]
programs=omni-api,nginx
priority=5
