# =============================================================================
# Omni Medical Suite — Nginx SSL Params
# =============================================================================
# Place at: /etc/nginx/ssl-params.conf
# Included by the main server block for DHE param and DH key exchange
# =============================================================================

# Diffie-Hellman parameter (generate with: openssl dhparam -out /etc/nginx/dhparam.pem 2048)
ssl_dhparam /etc/nginx/dhparam.pem;

# HSTS (6 months, include subdomains, preload)
add_header Strict-Transport-Security "max-age=15768000; includeSubDomains; preload" always;
