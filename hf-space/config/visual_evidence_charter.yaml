version: "1"
name: visual-evidence-charter
principles:
  - استخراج ما هو مرئي لا الحكم بأنه صحيح.
  - فصل نص المصدر عن علامة الصح/الخطأ وعن ما هو غير مؤكد.
  - ممنوع تصحيح المصدر صامتاً إذا كان الخطأ مقصوداً للتعليم.
  - الجدول يبقى جدولاً، والقصاصة تُحفظ مع النص المقابل لا بدلاً عنه.
  - المثال الخاطئ يُوسم negative_example ولا يدخل كهدف تدريب.
status_levels: [PASS, PARTIAL, UNCERTAIN, FAILED]
