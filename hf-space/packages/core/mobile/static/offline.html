<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniFile — غير متصل</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            text-align: center;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
        p { color: #94a3b8; font-size: 0.95rem; margin: 0.25rem 0; }
        button {
            margin-top: 1.5rem;
            padding: 0.75rem 1.5rem;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="icon">📡</div>
    <h1>وضع عدم الاتصال</h1>
    <p>التطبيق غير متصل بالخادم.</p>
    <p>يمكنك متابعة المراجعة بعد استعادة الاتصال.</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
</body>
</html>
